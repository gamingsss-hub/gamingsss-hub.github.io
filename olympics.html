<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= OLYMPICS 25 REAL ================= */
add("OLYMPICS",[
{
q:"Olympics held after every?",
o:["2 years","3 years","4 years","5 years"],
c:2
},
{
q:"First modern Olympics held in?",
o:["London","Athens","Paris","Tokyo"],
c:1
},
{
q:"Year of first modern Olympics?",
o:["1896","1900","1880","1910"],
c:0
},
{
q:"Olympic symbol rings count?",
o:["4","5","6","7"],
c:1
},
{
q:"Olympic motto?",
o:["Faster Higher Stronger","Play Win Repeat","Never Stop","Go Global"],
c:0
},
{
q:"Olympic headquarters?",
o:["Zurich","Lausanne","Paris","London"],
c:1
},
{
q:"Who founded modern Olympics?",
o:["Pierre de Coubertin","Newton","Einstein","Lincoln"],
c:0
},
{
q:"Olympic gold medal position?",
o:["1st","2nd","3rd","4th"],
c:0
},
{
q:"Olympic silver medal position?",
o:["1st","2nd","3rd","4th"],
c:1
},
{
q:"Olympic bronze medal position?",
o:["1st","2nd","3rd","4th"],
c:2
},
{
q:"How many rings in Olympic logo?",
o:["3","4","5","6"],
c:2
},
{
q:"Olympic flame originated from?",
o:["India","Greece","USA","France"],
c:1
},
{
q:"Summer Olympics next scheduled year?",
o:["2026","2028","2030","2032"],
c:1
},
{
q:"Olympics includes Winter and Summer Games?",
o:["True","False","Sometimes","Unknown"],
c:0
},
{
q:"Women first competed in Olympics in?",
o:["1900","1912","1920","1936"],
c:0
},
{
q:"Olympic mascot represents?",
o:["Host identity","Winner","Coach","Country flag"],
c:0
},
{
q:"Which city hosted 2024 Summer Olympics?",
o:["Tokyo","Paris","Rome","Madrid"],
c:1
},
{
q:"Olympic flag background color?",
o:["Blue","White","Black","Red"],
c:1
},
{
q:"Ancient Olympics started in?",
o:["Rome","Greece","Egypt","China"],
c:1
},
{
q:"Olympics are governed by?",
o:["FIFA","IOC","NBA","ICC"],
c:1
},
{
q:"Olympic rings represent?",
o:["Continents participation","Countries","Sports","Teams"],
c:0
},
{
q:"Opening ceremony includes?",
o:["Parade of Nations","Final Match","Award Show","Auction"],
c:0
},
{
q:"Which medal is highest?",
o:["Bronze","Silver","Gold","Diamond"],
c:2
},
{
q:"Winter Olympics separated from Summer after?",
o:["1992","1988","2000","1970"],
c:0
},
{
q:"Olympics originated approximately?",
o:["3000 years ago","500 years ago","100 years ago","50 years ago"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
