<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free AI Resume Builder | Toolora AI</title>

<meta name="description" content="Create professional ATS-friendly resumes instantly using Toolora AI Resume Builder.">

<meta name="keywords" content="AI Resume Builder, Resume Generator, CV Builder, ATS Resume, Toolora AI">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="resume-builder.css">

</head>

<body>

<div class="bg"></div>

<div class="container">

<header>

<h1>📄 Toolora AI Resume Builder</h1>

<p>Create Professional ATS Friendly Resume in Seconds</p>

</header>

<div class="main">

<!-- LEFT PANEL -->

<div class="left-panel">

<label>Full Name</label>
<input type="text" id="name" placeholder="John Doe">

<label>Email</label>
<input type="email" id="email" placeholder="john@example.com">

<label>Phone</label>
<input type="text" id="phone" placeholder="+91 XXXXX XXXXX">

<label>Address</label>
<input type="text" id="address" placeholder="Your Address">

<label>Education</label>
<textarea id="education" placeholder="Your Education"></textarea>

<label>Experience</label>
<textarea id="experience" placeholder="Work Experience"></textarea>

<label>Skills</label>
<textarea id="skills" placeholder="HTML, CSS, JavaScript..."></textarea>

<label>Languages</label>
<input type="text" id="languages" placeholder="English, Hindi">

<button id="generate">
🤖 Generate Resume
</button>

</div>

<!-- RIGHT PANEL -->

<div class="right-panel">

<div class="toolbar">

<button id="copy">
📋 Copy
</button>

<button id="download">
📥 Download PDF
</button>

<button id="regenerate">
🔄 Regenerate
</button>

</div>

<div id="resumeOutput">

Your AI Resume will appear here...

</div>

</div>

</div>

</div>

<script src="resume-builder.js"></script>

</body>
</html>
