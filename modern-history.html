<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= ENGLISH 25 REAL ================= */
add("ENGLISH",[
{
q:"French Revolution began in?",
o:["1789","1776","1815","1857"],
c:0
},
{
q:"Who discovered America?",
o:["Columbus","Vasco da Gama","Cook","Magellan"],
c:0
},
{
q:"Who gave theory of non-violence in India?",
o:["Mahatma Gandhi","Nehru","Subhas Bose","Patel"],
c:0
},
{
q:"Indian Revolt took place in?",
o:["1857","1947","1757","1905"],
c:0
},
{
q:"Who was first Prime Minister of India?",
o:["Nehru","Patel","Gandhi","Rajendra Prasad"],
c:0
},
{
q:"India became independent in?",
o:["1947","1950","1945","1930"],
c:0
},
{
q:"Who gave slogan 'Give me blood and I will give you freedom'?",
o:["Subhas Chandra Bose","Gandhi","Nehru","Tilak"],
c:0
},
{
q:"World War I started in?",
o:["1914","1918","1939","1945"],
c:0
},
{
q:"World War II ended in?",
o:["1945","1939","1950","1918"],
c:0
},
{
q:"Who was known as Iron Man of India?",
o:["Sardar Patel","Gandhi","Nehru","Bhagat Singh"],
c:0
},
{
q:"Who wrote Indian National Anthem?",
o:["Rabindranath Tagore","Premchand","Gandhi","Bankim"],
c:0
},
{
q:"Partition of India happened in?",
o:["1947","1942","1950","1935"],
c:0
},
{
q:"Who founded Indian National Congress?",
o:["A.O. Hume","Gandhi","Tilak","Nehru"],
c:0
},
{
q:"Who invented telephone?",
o:["Alexander Graham Bell","Newton","Tesla","Edison"],
c:0
},
{
q:"Who invented electric bulb?",
o:["Edison","Bell","Newton","Tesla"],
c:0
},
{
q:"Berlin Wall fell in?",
o:["1989","1945","1995","1970"],
c:0
},
{
q:"Who was first President of India?",
o:["Rajendra Prasad","Nehru","Patel","Gandhi"],
c:0
},
{
q:"Who led Salt March?",
o:["Mahatma Gandhi","Subhas Bose","Tilak","Nehru"],
c:0
},
{
q:"Quit India Movement started in?",
o:["1942","1930","1947","1919"],
c:0
},
{
q:"Who was called Frontier Gandhi?",
o:["Khan Abdul Ghaffar Khan","Patel","Nehru","Tilak"],
c:0
},
{
q:"UNO formed in?",
o:["1945","1919","1930","1950"],
c:0
},
{
q:"Cold War mainly between?",
o:["USA & USSR","India & China","UK & France","Germany & Italy"],
c:0
},
{
q:"Who wrote Vande Mataram?",
o:["Bankim Chandra","Tagore","Premchand","Nehru"],
c:0
},
{
q:"Who was first man on Moon?",
o:["Neil Armstrong","Buzz Aldrin","Yuri Gagarin","Kalpana"],
c:0
},
{
q:"Indian Constitution came into force in?",
o:["1950","1947","1942","1952"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
