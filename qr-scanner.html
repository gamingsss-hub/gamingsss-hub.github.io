<style>

.logo i {

.container {

}

.badge {
    display: inline-block;

    font-size: clamp(30px,6vw,45px);
    margin-bottom: 12px;
}

    color: #9ba9bc;
    line-height: 1.6;
    margin-bottom: 30px;
}

.scanner-card {
    background: #111a2a;
    border: 1px solid #26354a;

    padding: 22px;

    width: 100%;
    overflow: hidden;
    border-radius: 15px;

}

    display: grid;

.result-buttons button, .result-buttons a {

}

    text-align: center;

}

@media(max-width:480px) {
    body { padding: 14px; }
    .scanner-card { padding: 13px; }

<body>

<header class="navbar">
    <div class="logo">
        <i class="fa-solid fa-qrcode"></i>
        Toolora AI
    </div>
    <a href="index.html" class="back">← Home</a>
</header>

<main class="container">

    <div class="badge">⚡ Free Online QR Scanner</div>

    <h1>QR Code Scanner</h1>

    <p class="subtitle">
        Scan any QR code using your camera or upload a QR image.
        Fast, simple and free.
    </p>

    <div class="scanner-card">

        <div id="reader"></div>

        <div class="controls">
            <button class="primary" id="startBtn">
                Start Scanner
            </button>

            <button class="secondary" id="stopBtn" disabled>
                Stop Scanner
            </button>
        </div>

        <label for="fileInput" class="upload-label">
            📁 Upload QR Image
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

        <div class="status" id="status">
            Scanner is ready. Press Start Scanner.
        </div>

        <div class="result" id="resultBox">

            <h3>✓ QR Code Detected</h3>

            <p id="resultText"></p>

            <div class="result-buttons">

                <button class="copy-btn" id="copyBtn">
                    Copy Result
                </button>

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="open-link"
                    id="openLink"
                >
                    Open Link ↗
                </a>

            </div>

        </div>

    </div>

</main>

<footer class="footer">
    © 2026 Toolora AI. All Rights Reserved.
</footer>

<script>
const statusText = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const fileInput = document.getElementById("fileInput");

const resultBox = document.getElementById("resultBox");
const resultText = document.getElementById("resultText");
const copyBtn = document.getElementById("copyBtn");
const openLink = document.getElementById("openLink");

let scanner = null;
let isRunning = false;
let lastResult = "";

function showResult(text) {
    lastResult = text;

    resultText.textContent = text;
    resultBox.style.display = "block";

    openLink.style.display = "none";
    openLink.removeAttribute("href");

    try {
        const url = new URL(text);

        if (
            url.protocol === "https:" ||
            url.protocol === "http:"
        ) {
            openLink.href = url.href;
            openLink.style.display = "block";
        }
    } catch (error) {
        // Result is text, not a valid URL.
    }

    statusText.textContent = "QR code successfully scanned!";
}

async function startScanner() {

    if (isRunning) return;

    if (!window.Html5Qrcode) {
        statusText.textContent =
            "QR scanner library failed to load. Check your internet.";
        return;
    }

    if (!window.isSecureContext) {
        statusText.textContent =
            "Camera requires HTTPS. Open your GitHub Pages website.";
        return;
    }

    try {
        if (!scanner) {
            scanner = new Html5Qrcode("reader");
        }

        statusText.textContent = "Starting camera...";

        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 230, height: 230 },
                aspectRatio: 1
            },
            (decodedText) => {
                showResult(decodedText);
                stopScanner();
            },
            () => {}
        );

        isRunning = true;

        startBtn.disabled = true;
        stopBtn.disabled = false;

        statusText.textContent = "Camera is active. Point it at a QR code.";

    } catch (error) {

        statusText.textContent =
            "Camera could not start. Allow camera permission and try again.";

        console.error(error);
    }
}

async function stopScanner() {

    if (!scanner || !isRunning) return;

    try {
        await scanner.stop();
        isRunning = false;

        startBtn.disabled = false;
        stopBtn.disabled = true;

        statusText.textContent = "Scanner stopped.";

    } catch (error) {
        console.error(error);
        statusText.textContent = "Unable to stop scanner.";
    }
}

startBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);

fileInput.addEventListener("change", async function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (!window.Html5Qrcode) {
        statusText.textContent = "Scanner library is unavailable.";
        return;
    }

    try {

        if (isRunning) {
            await stopScanner();
        }

        if (!scanner) {
            scanner = new Html5Qrcode("reader");
        }

        statusText.textContent = "Scanning uploaded image...";

        const decodedText = await scanner.scanFile(file, true);

        showResult(decodedText);

    } catch (error) {

        resultBox.style.display = "none";

        statusText.textContent =
            "No QR code found in this image. Try another image.";

    } finally {
        fileInput.value = "";
    }
});

copyBtn.addEventListener("click", async function() {

    if (!lastResult) return;

    try {
        await navigator.clipboard.writeText(lastResult);
        copyBtn.textContent = "Copied ✓";

        setTimeout(() => {
            copyBtn.textContent = "Copy Result";
        }, 1800);

    } catch (error) {
        statusText.textContent =
            "Copy failed. Please select and copy the result manually.";
    }
});
</script>

</body>
