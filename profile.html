<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Profile | QuizEmpire

</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:

linear-gradient(
135deg,
#030712,
#111827,
#1e1b4b
);

color:white;

padding:20px;

}

.wrap{

max-width:900px;

margin:auto;

}

.profile{

text-align:center;

padding:40px;

background:

linear-gradient(
145deg,
#172554,
#1e293b
);

border-radius:30px;

}

.avatar{

width:140px;

height:140px;

border-radius:50%;

background:

linear-gradient(
45deg,
#22d3ee,
#7c3aed
);

margin:auto;

display:flex;

align-items:center;

justify-content:center;

font-size:60px;

}

.name{

font-size:34px;

margin-top:20px;

}

.level{

color:#67e8f9;

margin-top:10px;

}

.bar{

height:16px;

background:#0f172a;

border-radius:999px;

margin-top:25px;

overflow:hidden;

}

.fill{

width:30%;

height:100%;

background:#22d3ee;

}

.grid{

display:grid;

grid-template-columns:

repeat(
3,
1fr
);

gap:20px;

margin-top:35px;

}

.box{

padding:25px;

background:#111827;

border-radius:22px;

text-align:center;

}

.btn{

margin-top:35px;

padding:18px;

width:100%;

border:none;

border-radius:20px;

background:#22d3ee;

font-size:18px;

}

</style>

</head>

<body>

<div class="wrap">

<div class="profile">

<div class="avatar">

👑

</div>

<div class="name">

Quiz Player

</div>

<div class="level">

Level 3

</div>

<div class="bar">

<div
class="fill"
id="xp">

</div>

</div>

<div class="grid">

<div class="box">

🏆

<h2>

12

</h2>

Wins

</div>

<div class="box">

🔥

<h2>

8

</h2>

Streak

</div>

<div class="box">

⭐

<h2 id="score">

100

</h2>

XP

</div>

</div>

<button
class="btn"
onclick="gain()">

Gain XP

</button>

</div>

</div>

<script>

let xp=

100;

function gain(){

xp+=50;

document

.getElementById(

"score"

)

.innerHTML=

xp;

document

.getElementById(

"xp"

)

.style.width=

Math.min(

xp/5,

100

)

+

"%";

}

</script>

</body>

</html>
