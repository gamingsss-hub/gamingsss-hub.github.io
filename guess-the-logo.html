<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Guess The Logo Quiz – Test Your Brand Knowledge</title>

<meta name="description" content="Play Guess The Logo Quiz online and identify famous brand logos. Fun logo challenge with score system and multiple questions.">
<meta name="keywords" content="guess the logo, logo quiz, brand logo quiz, logo game, famous logos quiz, guess brand, logo challenge, online logo quiz, world brands quiz">
  
<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(

135deg,

#07172c,

#123f73

);

color:white;

padding:20px;

text-align:center;

}

.box{

max-width:550px;

margin:auto;

background:#102748;

padding:25px;

border-radius:25px;

}

#logo img{

width:150px;

height:150px;

object-fit:contain;

background:white;

padding:15px;

border-radius:18px;

}

.opt{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:14px;

font-size:18px;

background:#1d4ed8;

color:white;

}

#result{

font-size:22px;

margin-top:18px;

}

.info{

display:flex;

justify-content:space-between;

margin-top:20px;

}

</style>

</head>

<body>

<div class="box">

<h1>

🏆 Guess The Logo

</h1>

<br>

<div id="logo"></div>

<br>

<div id="options"></div>

<div id="result"></div>

<div class="info">

<div>

Score:

<span id="score">

0

</span>

</div>

<div>

<span id="progress">

1/15

</span>

</div>

</div>

</div>

<script>

let score=0;

let current=0;

const right=

new Audio(

"https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"

);

const wrong=

new Audio(

"https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"

);

const quiz=[

["apple.png","Apple"],

["youtube.png","YouTube"],

["netflix.png","Netflix"],

["instagram.png","Instagram"],

["spotify.png","Spotify"],

["amazon.png","Amazon"],

["facebook.png","Facebook"],

["whatsapp.png","WhatsApp"],

["tiktok.png","TikTok"],

["playstation.png","PlayStation"],

["disney.png","Disney"],

["google.png","Google"],

["microsoft.png","Microsoft"],

["openai.png","OpenAI"],

["flipkart.png","Flipkart"]

];

function shuffle(a){

return a.sort(

()=>Math.random()-.5

);

}

function load(){

document.getElementById("logo")

.innerHTML=

`

<img

src="${quiz[current][0]}"

alt="logo"

style="

width:150px;

height:150px;

object-fit:contain;

background:white;

padding:12px;

border-radius:20px;

display:block;

margin:auto;

">

`;

document

.getElementById(

"progress"

)

.innerHTML=

`${current+1}/15`;

document

.getElementById(

"result"

)

.innerHTML="";

let correct=

quiz[current][1];

let options=

shuffle([

correct,

...shuffle(

quiz

.filter(

x=>

x[1]!==correct

)

.slice(0,3)

.map(

x=>x[1]

)

)

]);

let html="";

options.forEach(v=>{

html+=`

<button

class="opt"

onclick=

"check('${v}')">

${v}

</button>

`;

});

document

.getElementById(

"options"

)

.innerHTML=

html;

}

function check(v){

let correct=

quiz[current][1];

if(

v===correct

){

right.play();

score++;

document

.getElementById(

"result"

)

.innerHTML=

"✅ Correct";

}

else{

wrong.play();

document

.getElementById(

"result"

)

.innerHTML=

"❌ "+correct;

}

document

.getElementById(

"score"

)

.innerHTML=

score;

setTimeout(

()=>{

current++;

if(

current<15

){

load();

}

else{

document.body.innerHTML=

`

<h1>

🏆 Final Score

</h1>

<h2>

${score}/15

</h2>

`;

}

},

1200

);

}

load();

</script>

</body>

</html>
