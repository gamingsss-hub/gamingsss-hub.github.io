<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Black Hole Game – Absorb Stars & Survive

</title>

<meta
name="description"

content=

"Play Black Hole Game online and absorb stars to survive and beat your high score.">

<meta
name="keywords"

content=

"black hole game, space game, absorb game, reaction game">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

background:

radial-gradient(

circle,

#020617,

#000814,

black

);

overflow:hidden;

font-family:Arial;

color:white;

}

.top{

position:absolute;

top:15px;

left:0;

right:0;

display:flex;

justify-content:space-around;

font-size:24px;

z-index:99;

}

#game{

width:100vw;

height:100vh;

position:relative;

}

#hole{

width:110px;

height:110px;

border-radius:50%;

position:absolute;

left:50%;

top:65%;

transform:

translate(-50%,-50%);

background:

radial-gradient(

circle,

black,

#0a0a0a

);

box-shadow:

0 0 100px

#2d8cff;

touch-action:none;

transition:

transform .05s linear;

}

.star{

width:45px;

height:45px;

position:absolute;

font-size:34px;

animation:

fall linear;

}

@keyframes fall{

from{

top:-10%;

}

to{

top:110%;

}

}

#start{

position:absolute;

left:50%;

top:50%;

transform:

translate(-50%,-50%);

padding:18px 35px;

font-size:24px;

border:none;

border-radius:18px;

background:

linear-gradient(

90deg,

#0099ff,

#0055ff

);

color:white;

z-index:999;

}

</style>

</head>

<body>

<div class="top">

<div>

⭐

<span id="score">

0

</span>

</div>

<div>

🏆

<span id="best">

0

</span>

</div>

</div>

<button

id="start"

onclick=

"start()">

START

</button>

<div id="game">

<div id="hole"></div>

</div>

<script>

let score=0;

let best=

localStorage

.getItem(

"holeBest"

)

||

0;

document

.getElementById(

"best"

)

.innerHTML=

best;

let active=false;

let speed=4;

const hole=

document

.getElementById(

"hole"

);

function moveHole(x,y){

hole.style.left=

(x-55)

+

"px";

hole.style.top=

(y-55)

+

"px";

}

document.addEventListener(

"mousemove",

e=>{

moveHole(

e.clientX,

e.clientY

);

}

);

document.addEventListener(

"touchmove",

e=>{

e.preventDefault();

moveHole(

e.touches[0].clientX,

e.touches[0].clientY

);

},

{

passive:false

}

);

document.addEventListener(

"touchstart",

e=>{

moveHole(

e.touches[0].clientX,

e.touches[0].clientY

);

}

);

function spawn(){

if(

!active

)

return;

let s=

document

.createElement(

"div"

);

s.className=

"star";

s.innerHTML=

"⭐";

s.style.left=

Math.random()

*90+

"%";

s.style.animationDuration=

speed+

"s";

document

.getElementById(

"game"

)

.appendChild(

s

);

let x=

setInterval(

()=>{

if(

!s.parentNode

){

clearInterval(

x

);

return;

}

let a=

s

.getBoundingClientRect();

let b=

hole

.getBoundingClientRect();

if(

a.left<b.right

&&

a.right>b.left

&&

a.top<b.bottom

&&

a.bottom>b.top

){

score++;

document

.getElementById(

"score"

)

.innerHTML=

score;

s.remove();

if(

speed>1)

speed-=0.05;

}

},

40

);

setTimeout(

()=>{

if(

s.parentNode

)

s.remove();

},

speed*1000);

}

function start(){

active=true;

score=0;

speed=4;

document

.getElementById(

"score"

)

.innerHTML=

0;

document

.getElementById(

"start"

)

.style.display=

"none";

setInterval(

spawn,

500

);

setTimeout(

()=>{

active=false;

if(

score>

best

){

best=score;

localStorage

.setItem(

"holeBest",

best

);

document

.getElementById(

"best"

)

.innerHTML=

best;

}

alert(

"Game Over ⭐ "+score

);

location.reload();

},

30000

);

}

</script>

</body>

</html>
