<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Percentage Calculator | Toolora
</title>

<meta
name="description"
content="Marks percentage + normal percentage calculator">

<meta
name="keywords"
content="percentage calculator, marks percentage, toolora">

<link rel="icon" href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050b18;
color:white;
padding:24px;
}

.box{
max-width:650px;
margin:auto;
background:#0d1730;
padding:30px;
border-radius:28px;
}

h1{
margin-bottom:18px;
}

.section{
margin-top:30px;
}

input{
width:100%;
padding:18px;
margin-top:12px;
border:none;
border-radius:18px;
background:#13213f;
color:white;
}

button{
width:100%;
padding:18px;
margin-top:16px;
border:none;
border-radius:18px;

background:
linear-gradient(
45deg,
#6d42ff,
#009dff
);

color:white;

}

.result{
margin-top:18px;
font-size:30px;
font-weight:900;
}

.small{
color:#7dd3fc;
margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

<h1>
📊 Percentage Calculator
</h1>

<div class="section">

<h2>
Marks Percentage
</h2>

<input
id="total"
type="number"
placeholder="Total Marks">

<input
id="obtained"
type="number"
placeholder="Obtained Marks">

<button onclick="marksCalc()">

Calculate %

</button>

<div
class="result"
id="marksResult">

0%

</div>

<div
class="small"
id="grade">

—

</div>

</div>



<div class="section">

<h2>

Normal Percentage

</h2>

<input
id="number"
type="number"
placeholder="Enter Number">

<input
id="percent"
type="number"
placeholder="Enter %">

<button onclick="normalCalc()">

Find %

</button>

<div
class="result"
id="normalResult">

0

</div>

</div>

</div>



<script>

function marksCalc(){

let t=+total.value;
let o=+obtained.value;

if(!t||o>t){

marksResult.innerHTML="Invalid";

return;

}

let p=(o/t)*100;

marksResult.innerHTML=
p.toFixed(2)+"%";

if(p>=90)
grade.innerHTML="🏆 Excellent";

else if(p>=75)
grade.innerHTML="🔥 Very Good";

else if(p>=60)
grade.innerHTML="✅ Good";

else if(p>=40)
grade.innerHTML="🙂 Pass";

else
grade.innerHTML="❌ Fail";

}



function normalCalc(){

let n=+number.value;

let p=+percent.value;

normalResult.innerHTML=
((n*p)/100)
.toFixed(2);

}

</script>

</body>

</html>
