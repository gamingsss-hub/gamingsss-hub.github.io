name="keywords"
content="percentage calculator, percent tool, calculate percentage, toolora">

content="Toolora">

rel="icon"
href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#050b18;

color:white;

padding:24px;

}

.box{

max-width:620px;

margin:auto;

background:#091428;

padding:30px;

border-radius:30px;

}

.back{

color:white;

text-decoration:none;

}

h1{

font-size:36px;

margin:22px 0;

}

input{

width:100%;

padding:18px;

margin-top:14px;

border:none;

border-radius:18px;

background:#13213f;

color:white;

}

button{

width:100%;

padding:18px;

margin-top:18px;

border:none;

border-radius:20px;

background:

linear-gradient(
45deg,
#6d42ff,
#009dff
);

color:white;

font-size:18px;

}

.result{

margin-top:30px;

font-size:32px;

font-weight:900;

}

</style>

</head>

<body>

<div class="box">

<a
href="utility.html"
class="back">

← Utility

</a>

<h1>

📊 Percentage Calculator

</h1>

<input
id="percent"
type="number"
placeholder="Enter Percentage">

<input
id="number"
type="number"
placeholder="Enter Number">

<button onclick="calc()">

Calculate

</button>

<div
class="result"
id="result">

0

</div>

</div>

<script>

function calc(){

let p=

Number(

document.getElementById(

"percent"

).value

);

let n=

Number(

document.getElementById(

"number"

).value

);

let r=

(p/100)*n;

document.getElementById(

"result"

).innerHTML=

r;

}

</script>

</body>
