<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

QR Code Generator | Create QR Online

</title>

<meta
name="description"

content=

"Generate QR codes instantly online.">

<meta
name="keywords"

content=

"qr generator,qr code maker">

<script
src=

"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">

</script>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(
135deg,
#eef2ff,
#f8fafc,
#dbeafe
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:600px;

width:100%;

padding:30px;

background:white;

border-radius:30px;

box-shadow:

0 20px 60px
rgba(
0,
0,
0,
.12
);

text-align:center;

}

h1{

margin-bottom:20px;

}

input{

width:100%;

padding:18px;

border:none;

background:#f3f4f6;

border-radius:18px;

font-size:18px;

}

button{

margin-top:15px;

width:100%;

padding:16px;

border:none;

border-radius:18px;

background:

linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-size:18px;

}

#qr{

margin-top:30px;

display:flex;

justify-content:center;

}

.download{

margin-top:15px;

background:#22c55e;

}

</style>

</head>

<body>

<div class="box">

<h1>

🔳 QR Generator

</h1>

<input

id="text"

placeholder=

"Enter text or URL">

<button

onclick=

"make()">

Generate

</button>

<button

class="download"

onclick=

"downloadQR()">

Download

</button>

<div
id="qr">

</div>

</div>

<script>

function make(){

qr.innerHTML="";

new QRCode(

document.getElementById(

"qr"

),

{

text:

text.value,

width:260,

height:260

}

);

}

function downloadQR(){

let img=

document.querySelector(

"#qr img"

);

if(

!img

)

return;

let a=

document.createElement(

"a"

);

a.href=

img.src;

a.download=

"qrcode.png";

a.click();

}

</script>

</body>

</html>
