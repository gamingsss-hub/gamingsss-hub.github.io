<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

World Clock | Live Time

</title>

<meta
name="description"

content=

"Check current time in different countries">

<meta
name="keywords"

content=

"world clock,time zones,live time">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(
135deg,
#f8fafc,
#e0f2fe,
#eef2ff
);

padding:20px;

}

.box{

max-width:900px;

margin:auto;

padding:30px;

}

h1{

text-align:center;

margin-bottom:30px;

}

.grid{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(240px,1fr)
);

gap:16px;

}

.card{

padding:26px;

border-radius:28px;

background:white;

box-shadow:

0 20px 60px
rgba(
0,
0,
0,
.08
);

}

.city{

font-size:22px;

font-weight:800;

}

.time{

font-size:34px;

margin-top:12px;

}

.zone{

color:#64748b;

margin-top:8px;

}

</style>

</head>

<body>

<div class="box">

<h1>

🌍 World Clock

</h1>

<div
class="grid"

id="grid">

</div>

</div>

<script>

const cities=[

{

n:"New York",

z:"America/New_York"

},

{

n:"London",

z:"Europe/London"

},

{

n:"Delhi",

z:"Asia/Kolkata"

},

{

n:"Tokyo",

z:"Asia/Tokyo"

},

{

n:"Sydney",

z:"Australia/Sydney"

},

{

n:"Paris",

z:"Europe/Paris"

}

];

function update(){

grid.innerHTML="";

cities.forEach(

c=>{

let t=

new Date()

.toLocaleTimeString(

"en-US",

{

timeZone:

c.z

}

);

grid.innerHTML+=`

<div
class='card'>

<div
class='city'>

${c.n}

</div>

<div
class='time'>

${t}

</div>

<div
class='zone'>

${c.z}

</div>

</div>

`;

});

}

update();

setInterval(

update,

1000

);

</script>

</body>

</html>
