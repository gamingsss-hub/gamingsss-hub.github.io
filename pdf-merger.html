<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Merger | Toolora</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#050816,#111827,#1e3a8a,#7c3aed);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

color:white;

}

.container{

width:100%;
max-width:900px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

padding:35px;

border-radius:30px;

box-shadow:0 20px 60px rgba(0,0,0,.4);

}

h1{

text-align:center;
font-size:38px;
margin-bottom:10px;

}

.sub{

text-align:center;
color:#d1d5db;
margin-bottom:30px;

}

.upload{

border:3px dashed #60a5fa;

padding:45px;

border-radius:25px;

text-align:center;

cursor:pointer;

transition:.3s;

}

.upload:hover{

background:rgba(255,255,255,.05);

}

input[type=file]{

display:none;

}

#fileList{

margin-top:25px;

background:#111827;

padding:20px;

border-radius:18px;

line-height:2;

display:none;

}

button{

width:100%;

margin-top:25px;

padding:18px;

border:none;

border-radius:18px;

background:linear-gradient(45deg,#2563eb,#7c3aed);

color:white;

font-size:17px;

font-weight:700;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1>📄 PDF Merger</h1>

<p class="sub">

Merge Multiple PDF Files into One PDF

</p>

<label class="upload">

<input
type="file"
id="pdfInput"
accept=".pdf"
multiple>

<div style="font-size:70px;">📤</div>

<h2>Select PDF Files</h2>

<p>Choose two or more PDF files</p>

</label>

<div id="fileList"></div>

<button id="mergeBtn">

📄 Merge PDFs

</button>

<script>

const pdfInput=document.getElementById("pdfInput");

const fileList=document.getElementById("fileList");

const mergeBtn=document.getElementById("mergeBtn");

let files=[];

// ========= Upload PDFs =========

pdfInput.addEventListener("change",()=>{

files=[...pdfInput.files];

fileList.style.display="block";

fileList.innerHTML="<b>Selected Files</b><br><br>";

files.forEach((file,index)=>{

fileList.innerHTML+=

(index+1)+". "+file.name+"<br>";

});

});

// ========= Merge PDFs =========

mergeBtn.addEventListener("click",async()=>{

if(files.length<2){

alert("Please select at least 2 PDF files.");

return;

}

const mergedPdf=await PDFLib.PDFDocument.create();

for(const file of files){

const bytes=await file.arrayBuffer();

const pdf=await PDFLib.PDFDocument.load(bytes);

const pages=await mergedPdf.copyPages(

pdf,

pdf.getPageIndices()

);

pages.forEach(page=>mergedPdf.addPage(page));

}

const mergedBytes=await mergedPdf.save();

const blob=new Blob(

[mergedBytes],

{type:"application/pdf"}

);

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;

link.download="toolora-merged.pdf";

link.click();

showToast("✅ PDF Merged Successfully");

});

// ========= Toast =========

function showToast(message){

const toast=document.createElement("div");

toast.innerHTML=message;

toast.style.position="fixed";
toast.style.bottom="20px";
toast.style.right="20px";
toast.style.background="#22c55e";
toast.style.color="#fff";
toast.style.padding="15px 22px";
toast.style.borderRadius="14px";
toast.style.fontWeight="700";
toast.style.boxShadow="0 10px 30px rgba(0,0,0,.35)";
toast.style.zIndex="9999";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2000);

}

// ========= Drag & Drop =========

const upload=document.querySelector(".upload");

upload.addEventListener("dragover",(e)=>{

e.preventDefault();

upload.style.borderColor="#22c55e";

});

upload.addEventListener("dragleave",()=>{

upload.style.borderColor="#60a5fa";

});

upload.addEventListener("drop",(e)=>{

e.preventDefault();

upload.style.borderColor="#60a5fa";

pdfInput.files=e.dataTransfer.files;

pdfInput.dispatchEvent(new Event("change"));

});

</script>

</div>

</body>

</html>
