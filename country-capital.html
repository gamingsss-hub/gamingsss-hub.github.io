<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Country Capital Quiz | Test Your World Knowledge
</title>

<meta
name="description"
content="Play Country Capital Quiz online and test your world geography knowledge with capitals from around the globe.">

<meta
name="keywords"
content="country capital quiz, world capitals quiz, geography quiz, countries and capitals">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:
linear-gradient(
135deg,
#020617,
#071b34,
#000
);

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:800px;

width:100%;

padding:35px;

border-radius:30px;

background:
rgba(255,255,255,.05);

backdrop-filter:blur(20px);

}

h1{

text-align:center;

margin-bottom:20px;

color:#00d9ff;

}

.progress{

height:12px;

background:#1e293b;

border-radius:20px;

overflow:hidden;

margin-bottom:20px;

}

.fill{

height:100%;

width:0%;

background:#00d9ff;

transition:.3s;

}

.question{

font-size:28px;

margin-bottom:25px;

}

.options{

display:grid;

gap:15px;

}

.option{

padding:18px;

background:#111827;

border-radius:16px;

cursor:pointer;

}

.option:hover{

background:#0ea5e9;

}

.stats{

display:flex;

justify-content:space-between;

margin-top:20px;

}

button{

padding:14px 30px;

border:none;

border-radius:15px;

background:#00c8ff;

color:black;

font-weight:bold;

margin-top:25px;

cursor:pointer;

}

.result{

font-size:28px;

text-align:center;

}

</style>

</head>

<body>

<div class="box">

<h1>
🌍 Country Capital Quiz
</h1>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<div id="quiz">

<div id="question"
class="question">
Loading...
</div>

<div
id="options"
class="options">
</div>

<div class="stats">

<div>
Score:
<span id="score">
0
</span>
</div>

<div>
Time:
<span id="time">
0
</span>s
</div>

</div>

</div>

</div>

<script>

const data=[

["India","New Delhi"],

["Australia","Canberra"],

["Japan","Tokyo"],

["Canada","Ottawa"],

["Brazil","Brasilia"],

["France","Paris"],

["Italy","Rome"],

["Egypt","Cairo"],

["South Korea","Seoul"],

["Germany","Berlin"]

];

const capitals=[

"New Delhi",
"Canberra",
"Tokyo",
"Ottawa",
"Brasilia",
"Paris",
"Rome",
"Cairo",
"Seoul",
"Berlin"

];

let index=0;

let score=0;

let sec=0;

setInterval(

()=>{

sec++;

document

.getElementById(

"time"

)

.innerHTML=

sec;

},

1000

);

function shuffle(a){

return a

.sort(

()=>Math.random()-0.5

);

}

function load(){

if(index>=data.length){

document

.getElementById(

"quiz"

)

.innerHTML=

`

<div
class='result'>

🏆 Quiz Complete

<br><br>

Score:
${score}/${data.length}

<br><br>

<button
onclick='location.reload()'>

Play Again

</button>

</div>

`;

return;

}

document

.getElementById(

"fill"

)

.style.width=

(index/data.length*100)

+"%";

document

.getElementById(

"question"

)

.innerHTML=

`What is the capital of <br><br> 🌍 ${data[index][0]} ?`;

let opts=

shuffle(

[
data[index][1],
...shuffle(
capitals
)
.slice(
0,
3
)
]

)

.slice(
0,
4
);

let html="";

opts.forEach(

x=>{

html+=

`

<div
class='option'

onclick='pick("${x}")'>

${x}

</div>

`;

}

);

document

.getElementById(

"options"

)

.innerHTML=

html;

}

function pick(v){

if(

v===

data[index][1]

){

score++;

document

.getElementById(

"score"

)

.innerHTML=

score;

}

index++;

load();

}

load();

</script>

</body>

</html>
