<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= GALAXY 25 REAL ================= */
add("GALAXY",[
{
q:"Our galaxy name?",
o:["Andromeda","Milky Way","Whirlpool","Sombrero"],
c:1
},
{
q:"Milky Way type?",
o:["Elliptical","Spiral","Square","Ring"],
c:1
},
{
q:"Nearest major galaxy?",
o:["Andromeda","Whirlpool","Cartwheel","Pinwheel"],
c:0
},
{
q:"Galaxy contains?",
o:["Only stars","Stars gas dust","Only planets","Only black holes"],
c:1
},
{
q:"Center of Milky Way contains?",
o:["Planet","Black Hole","Moon","Nebula"],
c:1
},
{
q:"Approx stars in Milky Way?",
o:["100–400 billion","1000","1 million","10 million"],
c:0
},
{
q:"Milky Way shape viewed from side?",
o:["Flat disk","Triangle","Cube","Sphere"],
c:0
},
{
q:"Largest known galaxy type?",
o:["Spiral","Elliptical","Irregular","Ring"],
c:1
},
{
q:"What separates galaxies?",
o:["Ocean","Space","Air","Gravity"],
c:1
},
{
q:"Galaxy distance measured in?",
o:["KM","Light Year","Meter","Foot"],
c:1
},
{
q:"Andromeda moving toward?",
o:["Sun","Milky Way","Mars","Saturn"],
c:1
},
{
q:"Galaxy cluster means?",
o:["Group of galaxies","Stars only","Planets","Asteroids"],
c:0
},
{
q:"Milky Way belongs to?",
o:["Local Group","World Group","Solar Group","Mega Group"],
c:0
},
{
q:"Nearest dwarf galaxy?",
o:["Large Magellanic Cloud","Andromeda","Whirlpool","Cartwheel"],
c:0
},
{
q:"Galaxy formed mainly by?",
o:["Gravity","Wind","Water","Heat"],
c:0
},
{
q:"Galaxy with no clear shape?",
o:["Irregular","Spiral","Elliptical","Ring"],
c:0
},
{
q:"Black hole at Milky Way center called?",
o:["Sagittarius A*","Alpha","Beta","Nova"],
c:0
},
{
q:"Galaxy arms contain?",
o:["Stars","Dust","Gas","All"],
c:3
},
{
q:"Milky Way diameter approx?",
o:["100000 ly","1000 ly","100 ly","1M ly"],
c:0
},
{
q:"Star system of Earth?",
o:["Solar System","Moon System","Galaxy","Nebula"],
c:0
},
{
q:"Galaxy larger than Solar System?",
o:["No","Yes","Equal","Unknown"],
c:1
},
{
q:"Who discovered Milky Way structure?",
o:["Galileo","Newton","Einstein","Tesla"],
c:0
},
{
q:"Bright band in sky called?",
o:["Milky Way","Nebula","Orbit","Asteroid"],
c:0
},
{
q:"Galaxy collision can happen?",
o:["No","Yes","Rarely","Impossible"],
c:1
},
{
q:"Study of galaxies?",
o:["Astronomy","Biology","Chemistry","Ecology"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
