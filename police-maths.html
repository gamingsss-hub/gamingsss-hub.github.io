<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= MATH 25 REAL ================= */
add("MATH",[
{
q:"√1764=?",
o:["42","44","46","48"],
c:0
},

{
q:"25% of 640=?",
o:["160","150","180","140"],
c:0
},

{
q:"HCF of 36 and 48?",
o:["12","6","18","24"],
c:0
},

{
q:"LCM of 15 and 20?",
o:["60","30","45","90"],
c:0
},

{
q:"Cube root of 2197?",
o:["13","11","15","17"],
c:0
},

{
q:"Simple Interest of ₹1000 at 10% for 2 years?",
o:["200","100","300","250"],
c:0
},

{
q:"Average of 10,20,30,40?",
o:["25","20","30","35"],
c:0
},

{
q:"12×15=?",
o:["180","160","170","190"],
c:0
},

{
q:"2⁶=?",
o:["64","32","16","128"],
c:0
},

{
q:"Area of rectangle?",
o:["l×b","2(l+b)","b²","l²"],
c:0
},

{
q:"Perimeter of square?",
o:["4a","a²","2a","6a"],
c:0
},

{
q:"1/4 as percentage?",
o:["25%","20%","50%","75%"],
c:0
},

{
q:"Ratio 18:24=?",
o:["3:4","2:3","4:5","1:2"],
c:0
},

{
q:"15% of 200=?",
o:["30","40","20","25"],
c:0
},

{
q:"Distance=?",
o:["Speed×Time","Time÷Speed","Speed÷Distance","None"],
c:0
},

{
q:"√625=?",
o:["25","20","30","35"],
c:0
},

{
q:"(a+b)²=?",
o:["a²+2ab+b²","a²+b²","2ab","a²-b²"],
c:0
},

{
q:"Profit=SP−?",
o:["CP","MP","Loss","Discount"],
c:0
},

{
q:"Value of π?",
o:["3.14","3","4","2"],
c:0
},

{
q:"3/5=?",
o:["60%","40%","50%","80%"],
c:0
},

{
q:"20% of 300=?",
o:["60","50","70","80"],
c:0
},

{
q:"1000÷25=?",
o:["40","50","30","20"],
c:0
},

{
q:"Time=Distance÷?",
o:["Speed","Area","Height","Weight"],
c:0
},

{
q:"Square of 18?",
o:["324","364","284","300"],
c:0
},

{
q:"Triangle angle sum?",
o:["180°","360°","90°","270°"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
