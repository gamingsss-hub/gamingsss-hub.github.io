<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= ENGLISH 25 REAL ================= */
add("ENGLISH",[
{
q:"Meaning of 'Rapid'?",
o:["Slow","Fast","Weak","Small"],
c:1
},
{
q:"Synonym of Happy?",
o:["Sad","Joyful","Angry","Cold"],
c:1
},
{
q:"Antonym of Ancient?",
o:["Old","Modern","Past","Historic"],
c:1
},
{
q:"Meaning of 'Brilliant'?",
o:["Dull","Intelligent","Weak","Tiny"],
c:1
},
{
q:"Synonym of Huge?",
o:["Small","Tiny","Massive","Thin"],
c:2
},
{
q:"Antonym of Victory?",
o:["Success","Defeat","Win","Power"],
c:1
},
{
q:"Meaning of 'Observe'?",
o:["Ignore","Watch","Run","Forget"],
c:1
},
{
q:"Synonym of Begin?",
o:["Start","Stop","Finish","Close"],
c:0
},
{
q:"Antonym of Increase?",
o:["Grow","Expand","Decrease","Add"],
c:2
},
{
q:"Meaning of 'Ancient'?",
o:["Modern","Old","Fast","Clean"],
c:1
},
{
q:"Synonym of Smart?",
o:["Clever","Lazy","Weak","Bad"],
c:0
},
{
q:"Meaning of 'Tiny'?",
o:["Huge","Small","Tall","Heavy"],
c:1
},
{
q:"Antonym of Accept?",
o:["Allow","Reject","Take","Keep"],
c:1
},
{
q:"Meaning of 'Rare'?",
o:["Common","Unusual","Simple","Normal"],
c:1
},
{
q:"Synonym of Quick?",
o:["Fast","Slow","Heavy","Weak"],
c:0
},
{
q:"Meaning of 'Generous'?",
o:["Kind","Selfish","Rude","Angry"],
c:0
},
{
q:"Antonym of Honest?",
o:["Truthful","Fake","Loyal","Clean"],
c:1
},
{
q:"Meaning of 'Expand'?",
o:["Reduce","Grow","Shrink","Hide"],
c:1
},
{
q:"Synonym of Difficult?",
o:["Easy","Hard","Simple","Soft"],
c:1
},
{
q:"Meaning of 'Discover'?",
o:["Find","Lose","Forget","Hide"],
c:0
},
{
q:"Antonym of Bright?",
o:["Dark","Clear","Sharp","Light"],
c:0
},
{
q:"Meaning of 'Protect'?",
o:["Guard","Destroy","Leave","Ignore"],
c:0
},
{
q:"Synonym of Calm?",
o:["Peaceful","Angry","Loud","Wild"],
c:0
},
{
q:"Meaning of 'Journey'?",
o:["Trip","House","Book","Chair"],
c:0
},
{
q:"Antonym of Strong?",
o:["Powerful","Weak","Healthy","Large"],
c:1
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
