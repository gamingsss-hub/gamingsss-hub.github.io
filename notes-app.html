<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Notes App | Save Notes Online

</title>

<meta
name="description"
content="Create and save notes online">

<meta
name="keywords"
content="notes app,note pad,online notes">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(
135deg,
#eef2ff,
#dbeafe,
#ffffff
);

padding:20px;

display:flex;

justify-content:center;

}

.box{

width:100%;

max-width:600px;

background:white;

padding:25px;

border-radius:30px;

box-shadow:

0 20px 60px
rgba(0,0,0,.12);

}

h1{

text-align:center;

margin-bottom:20px;

}

textarea{

width:100%;

height:140px;

padding:20px;

border:none;

background:#f5f5f5;

border-radius:18px;

resize:none;

font-size:18px;

}

button{

width:100%;

margin-top:15px;

padding:16px;

border:none;

border-radius:18px;

background:

linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-size:18px;

}

.note{

padding:18px;

background:#f8fafc;

margin-top:15px;

border-radius:18px;

position:relative;

}

.del{

position:absolute;

right:15px;

top:15px;

background:red;

color:white;

border:none;

padding:8px 12px;

border-radius:10px;

}

</style>

</head>

<body>

<div class="box">

<h1>

📝 Notes App

</h1>

<textarea
id="txt"

placeholder=

"Write something...">

</textarea>

<button

onclick=

"add()">

Save Note

</button>

<div
id="notes">

</div>

</div>

<script>

let data=

JSON.parse(

localStorage.getItem(
"notes"
)

)||[];

show();

function save(){

localStorage.setItem(

"notes",

JSON.stringify(
data
)

);

}

function add(){

if(

!txt.value

)

return;

data.unshift(

txt.value

);

save();

show();

txt.value="";

}

function del(i){

data.splice(i,1);

save();

show();

}

function show(){

notes.innerHTML="";

data.forEach(

(x,i)=>{

notes.innerHTML+=`

<div class='note'>

${x}

<button
class='del'
onclick='del(${i})'>

Delete

</button>

</div>

`;

});

}

</script>

</body>

</html>
