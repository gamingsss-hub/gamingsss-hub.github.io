<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Leaderboard | QuizEmpire

</title>

<meta
name="description"

content="Check top scores and compete with players on QuizEmpire.">

<meta
name="keywords"

content="leaderboard, top scores, ranking, quiz empire">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

background:

linear-gradient(
135deg,
#030712,
#111827,
#1e1b4b
);

color:white;

padding:20px;

}

.container{

max-width:900px;

margin:auto;

}

.title{

font-size:52px;

text-align:center;

color:#67e8f9;

font-weight:900;

}

.sub{

text-align:center;

color:#cbd5e1;

margin-top:10px;

}

.board{

margin-top:40px;

display:flex;

flex-direction:column;

gap:20px;

}

.player{

background:

linear-gradient(
145deg,
#172554,
#1e293b
);

padding:25px;

border-radius:24px;

display:flex;

justify-content:space-between;

align-items:center;

}

.rank{

font-size:30px;

}

.name{

font-size:22px;

}

.score{

font-size:28px;

color:#22d3ee;

}

.you{

margin-top:40px;

padding:30px;

background:

#111827;

border-radius:24px;

text-align:center;

}

.btn{

padding:16px 35px;

border:none;

border-radius:18px;

font-size:18px;

cursor:pointer;

background:

#22d3ee;

color:black;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="title">

🏆 LEADERBOARD

</div>

<div class="sub">

Top Players Of QuizEmpire

</div>


<div class="board">

<div class="player">

<div>

<span class="rank">

🥇

</span>

<span class="name">

Champion

</span>

</div>

<div class="score">

9850

</div>

</div>


<div class="player">

<div>

🥈 Master

</div>

<div class="score">

8420

</div>

</div>


<div class="player">

<div>

🥉 Legend

</div>

<div class="score">

7900

</div>

</div>


<div class="player">

<div>

#4 Player

</div>

<div class="score">

6400

</div>

</div>


<div class="player">

<div>

#5 Quiz King

</div>

<div class="score">

5800

</div>

</div>

</div>



<div class="you">

<h2>

⭐ Your Score

</h2>

<br>

<h1 id="myscore">

0

</h1>

<button
class="btn"
onclick="addScore()">

Add +100

</button>

</div>

</div>


<script>

let score=

localStorage.score

||

0;

document

.getElementById(

"myscore"

)

.innerHTML=

score;

function addScore(){

score=

Number(

score

)

+

100;

localStorage.score=

score;

document

.getElementById(

"myscore"

)

.innerHTML=

score;

}

</script>

</body>

</html>
