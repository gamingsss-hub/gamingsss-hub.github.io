<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Reaction Test – Check Your Speed Online</title>

<meta name="description" content="Play Reaction Test online and measure your reaction speed in milliseconds. Challenge yourself and beat your best score.">

<meta name="keywords" content="reaction test, reaction speed test, speed game, click speed test, reflex test, online reaction game, reaction challenge, fast click test, human benchmark">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(
135deg,
#060818,
#0d1635,
#081f49
);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

color:white;

}

.box{

width:100%;

max-width:500px;

background:

rgba(
255,
255,
255,
.05
);

backdrop-filter:
blur(20px);

padding:30px;

border-radius:30px;

text-align:center;

box-shadow:

0 0 60px
rgba(
0,
150,
255,
.2

);

}

h1{

font-size:36px;

margin-bottom:15px;

}

#game{

height:260px;

border-radius:25px;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

background:

#101827;

margin-top:25px;

cursor:pointer;

transition:.3s;

}

button{

padding:16px 35px;

border:none;

border-radius:16px;

font-size:20px;

background:

linear-gradient(
90deg,
#00bfff,
#3b82f6
);

color:white;

margin-top:20px;

}

.stats{

display:flex;

justify-content:space-between;

margin-top:25px;

}

.glow{

box-shadow:

0 0 100px

lime;

}

</style>

</head>

<body>

<div class="box">

<h1>

⚡ Reaction Test

</h1>

<p>

Tap when screen turns green

</p>

<button

onclick=

"startGame()">

START

</button>

<div

id="game">

Ready?

</div>

<div

class="stats">

<div>

🏆 Best:

<span id="best">

--

</span>

ms

</div>

<div>

⚡ Last:

<span id="last">

--

</span>

ms

</div>

</div>

</div>

<script>

let start;

let active=false;

let timeout;

let best=

localStorage

.getItem(

"bestReaction"

)

||

"--";

document

.getElementById(

"best"

)

.innerHTML=

best;

function startGame(){

active=false;

let g=

document

.getElementById(

"game"

);

g

.classList

.remove(

"glow"

);

g.style.background=

"#8b0000";

g.innerHTML=

"Wait...";

timeout=

setTimeout(

()=>{

g.style.background=

"#00ff66";

g.classList.add(

"glow"

);

g.innerHTML=

"TAP NOW";

start=

Date.now();

active=true;

},

1500+

Math.random()

*3500

);

}

document

.getElementById(

"game"

)

.onclick=

()=>{

let g=

document

.getElementById(

"game"

);

if(!active){

g.innerHTML=

"Too Early 😭";

clearTimeout(

timeout

);

return;

}

let score=

Date.now()

-

start;

document

.getElementById(

"last"

)

.innerHTML=

score;

if(

best==="--"

||

score

<

best

){

best=

score;

localStorage

.setItem(

"bestReaction",

score

);

document

.getElementById(

"best"

)

.innerHTML=

score;

}

g.style.background=

"#101827";

g.classList.remove(

"glow"

);

g.innerHTML=

score+

" ms";

active=false;

};

</script>

</body>

</html>
