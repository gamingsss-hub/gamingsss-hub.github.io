<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Aim Trainer – Improve Your Aim Speed Online
</title>

<meta
name="description"

content=

"Play Aim Trainer online and improve reaction speed and target accuracy with this fun target challenge.">

<meta
name="keywords"

content=

"aim trainer,target game,reaction game,speed challenge,online game">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

radial-gradient(

circle,

#020617,

#07132e,

#000

);

height:100vh;

overflow:hidden;

color:white;

}

.top{

display:flex;

justify-content:space-around;

padding:20px;

font-size:24px;

}

#game{

height:80vh;

position:relative;

}

.target{

position:absolute;

width:90px;

height:90px;

border-radius:50%;

cursor:pointer;

background:

radial-gradient(

circle,

#ff0044,

#ff6600

);

box-shadow:

0 0 60px

#ff0066;

animation:

pulse 1s infinite;

}

@keyframes pulse{

50%{

transform:

scale(1.12);

}

}

#center{

text-align:center;

margin-top:40px;

}

button{

padding:18px 40px;

border:none;

border-radius:20px;

font-size:24px;

background:

linear-gradient(

90deg,

#00bfff,

#0055ff

);

color:white;

}

#msg{

margin-top:20px;

font-size:30px;

}

</style>

</head>

<body>

<div class="top">

<div>

⏱

<span id="time">

20

</span>

</div>

<div>

🎯

<span id="score">

0

</span>

</div>

<div>

🏆

<span id="best">

0

</span>

</div>

</div>

<div id="center">

<button onclick="start()">

START

</button>

<div id="msg">

Hit Targets

</div>

</div>

<div id="game">

</div>

<script>

let score=0;

let time=20;

let active=false;

let best=

localStorage

.getItem(

"bestAim"

)

||

0;

document

.getElementById(

"best"

)

.innerHTML=

best;

function target(){

if(

!active

)

return;

let t=

document

.createElement(

"div"

);

t.className=

"target";

t.style.left=

Math.random()

*80+

"%";

t.style.top=

Math.random()

*75+

"%";

t.onclick=

()=>{

score++;

document

.getElementById(

"score"

)

.innerHTML=

score;

t.remove();

target();

};

document

.getElementById(

"game"

)

.innerHTML="";

document

.getElementById(

"game"

)

.appendChild(

t

);

}

function start(){

score=0;

time=20;

active=true;

document

.getElementById(

"score"

)

.innerHTML=

0;

target();

let x=

setInterval(

()=>{

time--;

document

.getElementById(

"time"

)

.innerHTML=

time;

if(

time<=0

){

clearInterval(

x

);

active=false;

document

.getElementById(

"game"

)

.innerHTML="";

if(

score>

best

){

best=score;

localStorage

.setItem(

"bestAim",

best

);

document

.getElementById(

"best"

)

.innerHTML=

best;

}

document

.getElementById(

"msg"

)

.innerHTML=

`🔥 Score ${score}`;

}

},

1000

);

}

</script>

</body>

</html>
