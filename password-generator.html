<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | Create Strong & Secure Passwords | Toolora</title>

<meta name="description" content="Generate strong, secure and random passwords instantly. Choose password length, symbols, uppercase, lowercase and numbers with one click. Free Password Generator by Toolora.">

<meta name="keywords" content="password generator, strong password generator, secure password, random password, password creator, free password tool, toolora">

<link rel="icon" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

min-height:100vh;

background:
linear-gradient(135deg,#09091f,#1b0b40,#312e81,#2563eb);

display:flex;

justify-content:center;

align-items:center;

padding:25px;

color:white;

}

.container{

width:100%;

max-width:600px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.12);

border-radius:28px;

padding:35px;

box-shadow:0 20px 60px rgba(0,0,0,.45);

}

h1{

text-align:center;

font-size:34px;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#d1d5db;

margin-bottom:30px;

}

.passwordBox{

display:flex;

gap:12px;

margin-bottom:25px;

}

.passwordBox input{

flex:1;

padding:18px;

font-size:18px;

background:#0f172a;

border:none;

border-radius:15px;

color:white;

outline:none;

}

.passwordBox button{

padding:18px 22px;

border:none;

border-radius:15px;

background:#3b82f6;

color:white;

cursor:pointer;

font-weight:700;

}

.option{

display:flex;

justify-content:space-between;

align-items:center;

margin:18px 0;

}

input[type=range]{

width:100%;

margin-top:10px;

}

.switch{

transform:scale(1.2);

}

.generate{

width:100%;

padding:18px;

margin-top:30px;

border:none;

border-radius:18px;

font-size:18px;

font-weight:700;

cursor:pointer;

background:linear-gradient(45deg,#7c3aed,#2563eb);

color:white;

transition:.3s;

}

.generate:hover{

transform:translateY(-3px);

}

.strength{

margin-top:25px;

}

.bar{

height:12px;

border-radius:20px;

background:#1e293b;

overflow:hidden;

}

.fill{

height:100%;

width:20%;

background:red;

transition:.3s;

}

#status{

margin-top:12px;

font-weight:700;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h1>🔐 Password Generator</h1>

<p class="subtitle">

Generate ultra secure passwords instantly.

</p>

<div class="passwordBox">

<input
type="text"
id="password"
readonly>

<button onclick="copyPassword()">

📋

</button>

</div>
<!-- ================= OPTIONS ================= -->

<div class="option">

<span>Password Length</span>

<b id="lengthValue">16</b>

</div>

<input
type="range"
id="length"
min="8"
max="64"
value="16">



<div class="option">

<span>🔠 Uppercase Letters</span>

<input
type="checkbox"
id="upper"
class="switch"
checked>

</div>



<div class="option">

<span>🔡 Lowercase Letters</span>

<input
type="checkbox"
id="lower"
class="switch"
checked>

</div>



<div class="option">

<span>🔢 Numbers</span>

<input
type="checkbox"
id="number"
class="switch"
checked>

</div>



<div class="option">

<span>🔣 Symbols</span>

<input
type="checkbox"
id="symbol"
class="switch"
checked>

</div>



<div class="option">

<span>🚫 Exclude Similar Characters</span>

<input
type="checkbox"
id="similar"
class="switch">

</div>



<button class="generate" onclick="generatePassword()">

⚡ Generate Secure Password

</button>



<div class="strength">

<div class="bar">

<div class="fill" id="fill"></div>

</div>

<div id="status">

Weak

</div>

</div>

<script>

// ===== Length Slider =====

const slider = document.getElementById("length");
const lengthValue = document.getElementById("lengthValue");

slider.oninput = function () {
    lengthValue.innerText = this.value;
};

// ===== Generate Password =====

function generatePassword() {

    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lower = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+-={}[]<>?/";

    let chars = "";

    if (document.getElementById("uppercase").checked)
        chars += upper;

    if (document.getElementById("lowercase").checked)
        chars += lower;

    if (document.getElementById("numbers").checked)
        chars += numbers;

    if (document.getElementById("symbols").checked)
        chars += symbols;

    if (chars === "") {
        alert("Select at least one option!");
        return;
    }

    // Remove similar characters
    if (document.getElementById("exclude").checked) {
        chars = chars.replace(/[O0Il1]/g, "");
    }

    let password = "";

    for (let i = 0; i < slider.value; i++) {
        password += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    document.getElementById("password").value = password;

    checkStrength(password);
}

// ===== Copy Password =====

function copyPassword() {

    const pass = document.getElementById("password");

    if (pass.value === "") return;

    navigator.clipboard.writeText(pass.value);

    alert("✅ Password Copied!");
}

// ===== Strength Meter =====

function checkStrength(password) {

    let score = 0;

    if (password.length >= 8) score++;
    if (password.length >= 12) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    const fill = document.getElementById("fill");
    const status = document.getElementById("status");

    if (score <= 2) {

        fill.style.width = "30%";
        fill.style.background = "#ef4444";
        status.innerHTML = "🔴 Weak";

    } else if (score <= 4) {

        fill.style.width = "65%";
        fill.style.background = "#f59e0b";
        status.innerHTML = "🟡 Medium";

    } else {

        fill.style.width = "100%";
        fill.style.background = "#22c55e";
        status.innerHTML = "🟢 Strong";

    }
}

// Generate first password automatically
generatePassword();

</script>

</body>
</html>
