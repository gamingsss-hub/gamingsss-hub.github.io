<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | Toolora</title>

<meta name="description" content="Generate strong secure passwords instantly.">
<meta name="keywords" content="password generator, secure password, random password">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(135deg,#0f172a,#1e3a8a,#4f46e5,#7c3aed);

padding:20px;

}

.container{

width:100%;
max-width:560px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:30px;

padding:30px;

box-shadow:0 20px 60px rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.12);

color:#fff;

}

h1{

text-align:center;
font-size:34px;
margin-bottom:8px;

}

.sub{

text-align:center;
color:#d1d5db;
margin-bottom:30px;

}

.output{

display:flex;
gap:10px;
margin-bottom:25px;

}

.output input{

flex:1;

padding:18px;

border:none;

border-radius:16px;

background:#111827;

color:#fff;

font-size:18px;

outline:none;

}

.output button{

width:65px;

border:none;

border-radius:16px;

background:#2563eb;

color:white;

font-size:22px;

cursor:pointer;

}

.section{

margin:20px 0;

}

label{

font-weight:600;

}

.rangeValue{

float:right;

font-weight:700;

color:#38bdf8;

}

input[type=range]{

width:100%;

margin-top:12px;

}

.option{

display:flex;

justify-content:space-between;

align-items:center;

padding:12px 0;

border-bottom:1px solid rgba(255,255,255,.08);

}

.option:last-child{

border:none;

}

.generate{

width:100%;

margin-top:25px;

padding:18px;

border:none;

border-radius:18px;

background:linear-gradient(90deg,#2563eb,#7c3aed);

color:white;

font-size:18px;

font-weight:700;

cursor:pointer;

}

.strength{

margin-top:25px;

}

.bar{

height:12px;

background:#1f2937;

border-radius:50px;

overflow:hidden;

}

.fill{

width:0%;

height:100%;

background:#22c55e;

transition:.4s;

}

#status{

text-align:center;

margin-top:12px;

font-weight:700;

}

</style>

</head>

<body>

<div class="container">

<h1>🔐 Password Generator</h1>

<p class="sub">

Generate Ultra Secure Passwords

</p>

<div class="output">

<input
id="password"
readonly>

<button
onclick="copyPassword()">

📋

</button>

</div>

<!-- ================= PASSWORD LENGTH ================= -->

<div class="section">

<label>

Password Length

</label>

<span
class="rangeValue"
id="lengthValue">

16

</span>

<input
type="range"
id="length"
min="8"
max="64"
value="16">

</div>



<!-- ================= OPTIONS ================= -->

<div class="option">

<span>

🔠 Uppercase Letters

</span>

<input
type="checkbox"
id="uppercase"
checked>

</div>



<div class="option">

<span>

🔡 Lowercase Letters

</span>

<input
type="checkbox"
id="lowercase"
checked>

</div>



<div class="option">

<span>

🔢 Numbers

</span>

<input
type="checkbox"
id="numbers"
checked>

</div>



<div class="option">

<span>

🔣 Symbols

</span>

<input
type="checkbox"
id="symbols"
checked>

</div>



<div class="option">

<span>

🚫 Exclude Similar Characters (O 0 I l 1)

</span>

<input
type="checkbox"
id="exclude">

</div>



<button
class="generate"
onclick="generatePassword()">

⚡ Generate Secure Password

</button>



<div class="strength">

<div class="bar">

<div
class="fill"
id="fill">

</div>

</div>

<div
id="status">

Password Strength

</div>

</div>

<script>

// ===== Elements =====

const slider = document.getElementById("length");
const lengthValue = document.getElementById("lengthValue");

const passwordBox = document.getElementById("password");

slider.addEventListener("input", () => {
    lengthValue.innerText = slider.value;
});

// ===== Generate Password =====

function generatePassword(){

const upper="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lower="abcdefghijklmnopqrstuvwxyz";
const number="0123456789";
const symbol="!@#$%^&*()_+-=[]{}<>?/";

let chars="";

if(document.getElementById("uppercase").checked) chars+=upper;
if(document.getElementById("lowercase").checked) chars+=lower;
if(document.getElementById("numbers").checked) chars+=number;
if(document.getElementById("symbols").checked) chars+=symbol;

if(chars===""){
alert("Select at least one option.");
return;
}

if(document.getElementById("exclude").checked){

chars=chars.replace(/[O0Il1]/g,"");

}

let password="";

for(let i=0;i<slider.value;i++){

password+=chars.charAt(Math.floor(Math.random()*chars.length));

}

passwordBox.value=password;

strength(password);

}

// ===== Copy =====

function copyPassword(){

if(passwordBox.value==="") return;

navigator.clipboard.writeText(passwordBox.value);

alert("✅ Password Copied");

}

// ===== Strength =====

function strength(password){

let score=0;

if(password.length>=8) score++;
if(password.length>=12) score++;
if(/[A-Z]/.test(password)) score++;
if(/[a-z]/.test(password)) score++;
if(/[0-9]/.test(password)) score++;
if(/[^A-Za-z0-9]/.test(password)) score++;

const fill=document.getElementById("fill");
const status=document.getElementById("status");

if(score<=2){

fill.style.width="30%";
fill.style.background="#ef4444";
status.innerHTML="🔴 Weak Password";

}

else if(score<=4){

fill.style.width="70%";
fill.style.background="#f59e0b";
status.innerHTML="🟡 Medium Password";

}

else{

fill.style.width="100%";
fill.style.background="#22c55e";
status.innerHTML="🟢 Strong Password";

}

}

// Auto Generate

generatePassword();

</script>

</div>

</body>
</html>
