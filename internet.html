<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= ENGLISH 25 REAL ================= */
add("ENGLISH",[
{
q:"WWW stands for?",
o:["World Web Work","World Wide Web","Wide World Web","Web World Wide"],
c:1
},
{
q:"Which protocol opens websites?",
o:["FTP","HTTP","SMTP","USB"],
c:1
},
{
q:"Full form of URL?",
o:["Uniform Resource Locator","Universal Resource Link","Unique Reference Locator","User Resource Link"],
c:0
},
{
q:"Which company owns YouTube?",
o:["Meta","Google","Apple","Microsoft"],
c:1
},
{
q:"Domain of educational websites?",
o:[".com",".edu",".gov",".net"],
c:1
},
{
q:"What does Wi-Fi provide?",
o:["Storage","Internet Connection","Battery","RAM"],
c:1
},
{
q:"Which is a search engine?",
o:["Chrome","Google","Windows","HTML"],
c:1
},
{
q:"HTTPS is mainly for?",
o:["Gaming","Security","Music","Video"],
c:1
},
{
q:"Which one is an email service?",
o:["Gmail","Chrome","Linux","CPU"],
c:0
},
{
q:"IP address identifies?",
o:["Device","Keyboard","Browser","Monitor"],
c:0
},
{
q:"Which browser is developed by Google?",
o:["Safari","Chrome","Firefox","Edge"],
c:1
},
{
q:"FTP is used for?",
o:["File Transfer","Video Call","Search","Coding"],
c:0
},
{
q:"Which company created Facebook?",
o:["Google","Meta","Apple","Amazon"],
c:1
},
{
q:"Spam means?",
o:["Unwanted Messages","Fast Internet","Gaming","Storage"],
c:0
},
{
q:"Cloud storage example?",
o:["Google Drive","CPU","RAM","Monitor"],
c:0
},
{
q:"Full form of VPN?",
o:["Virtual Private Network","Verified Public Network","Virtual Public Node","Video Private Network"],
c:0
},
{
q:"Which is not a browser?",
o:["Chrome","Firefox","Excel","Edge"],
c:2
},
{
q:"Cookies on websites store?",
o:["User Data","Battery","Sound","RAM"],
c:0
},
{
q:"What does download mean?",
o:["Upload File","Receive File","Delete File","Scan File"],
c:1
},
{
q:"Which extension is webpage?",
o:[".html",".mp3",".jpg",".pdf"],
c:0
},
{
q:"Social media platform?",
o:["Instagram","Excel","CPU","RAM"],
c:0
},
{
q:"DNS converts?",
o:["Names to IP","Video to Audio","RAM to ROM","Code to App"],
c:0
},
{
q:"What is bandwidth?",
o:["Internet Capacity","Battery","Storage","Virus"],
c:0
},
{
q:"Which protocol sends email?",
o:["SMTP","HTTP","FTP","USB"],
c:0
},
{
q:"Internet was originally developed for?",
o:["Research Networks","Movies","Gaming","Shopping"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>
