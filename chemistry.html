<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= CHEMISTRY 25 REAL ================= */
add("CHEMISTRY",[
{
q:"Atomic number of Carbon?",
o:["6","12","14","8"],
c:0
},
{
q:"pH of pure water?",
o:["5","6","7","8"],
c:2
},
{
q:"Smallest particle of element?",
o:["Atom","Electron","Proton","Ion"],
c:0
},
{
q:"Chemical formula of Sulfuric acid?",
o:["HNO3","H2SO4","HCl","NaOH"],
c:1
},
{
q:"Avogadro number?",
o:["6.022×10²³","3×10⁸","9.8","22.4"],
c:0
},
{
q:"Gas used in balloons?",
o:["Oxygen","Nitrogen","Helium","CO2"],
c:2
},
{
q:"Strongest intermolecular force?",
o:["Hydrogen bond","London force","Dipole","None"],
c:0
},
{
q:"Unit of molarity?",
o:["mol/L","kg","atm","N"],
c:0
},
{
q:"Oxidation means?",
o:["Gain e⁻","Loss e⁻","Gain proton","Loss neutron"],
c:1
},
{
q:"Formula of methane?",
o:["CH4","C2H6","CO2","CH3OH"],
c:0
},
{
q:"Element liquid at room temp?",
o:["Mercury","Iron","Copper","Gold"],
c:0
},
{
q:"Ideal gas equation?",
o:["PV=nRT","F=ma","E=mc²","V=IR"],
c:0
},
{
q:"Atomic number equals?",
o:["Protons","Neutrons","Mass","Electrons+Neutrons"],
c:0
},
{
q:"Chemical symbol of Sodium?",
o:["S","So","Na","N"],
c:2
},
{
q:"Most abundant gas?",
o:["Oxygen","Nitrogen","CO2","Argon"],
c:1
},
{
q:"Formula of ammonia?",
o:["NH3","NO2","HNO3","N2"],
c:0
},
{
q:"Acid turns blue litmus?",
o:["Red","Green","Yellow","White"],
c:0
},
{
q:"SI unit of amount of substance?",
o:["Mole","Gram","Litre","Molarity"],
c:0
},
{
q:"Process solid→gas?",
o:["Condensation","Sublimation","Fusion","Freezing"],
c:1
},
{
q:"Most electronegative element?",
o:["Oxygen","Fluorine","Chlorine","Hydrogen"],
c:1
},
{
q:"Formula of quicklime?",
o:["CaO","CaCO3","CaOH","CO2"],
c:0
},
{
q:"Chemical formula of baking soda?",
o:["NaHCO3","NaCl","NaOH","KOH"],
c:0
},
{
q:"Electron discovered by?",
o:["Rutherford","Bohr","J.J. Thomson","Dalton"],
c:2
},
{
q:"Metal liquid at room temp?",
o:["Mercury","Silver","Iron","Zinc"],
c:0
},
{
q:"Universal solvent?",
o:["Alcohol","Water","Acid","Oil"],
c:1
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
