<style>

);

rgba(2,6,23,.95);

90deg,

);

0 0 15px #22c55e;
}

}

}

}

/* PHONE OPTIMIZED SIZE */

.box{

.top{

}

}

}

.option{

}

}

}

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= MATH 25 REAL ================= */
add("MATHS",[
{
q:"25% of 960=?",
o:["240","220","260","280"],
c:0
},

{
q:"√3136=?",
o:["56","54","58","52"],
c:0
},

{
q:"LCM of 36 and 48?",
o:["144","72","96","120"],
c:0
},

{
q:"HCF of 144 and 180?",
o:["36","18","24","30"],
c:0
},

{
q:"Average of 18,24,30,42,36=?",
o:["30","32","28","34"],
c:0
},

{
q:"SI on ₹5000 at 8% for 2 years?",
o:["800","700","600","900"],
c:0
},

{
q:"CI on ₹1000 at 10% for 2 years?",
o:["210","200","220","190"],
c:0
},

{
q:"40% of 750=?",
o:["300","250","350","400"],
c:0
},

{
q:"Area of circle radius 7?",
o:["154","144","164","174"],
c:0
},

{
q:"Perimeter of rectangle l=18 b=12?",
o:["60","50","72","48"],
c:0
},

{
q:"Cube root of 2197=?",
o:["13","12","11","14"],
c:0
},

{
q:"2⁵ × 2³=?",
o:["256","128","64","512"],
c:0
},

{
q:"Profit% if CP=800 SP=920?",
o:["15%","20%","10%","18%"],
c:0
},

{
q:"Speed 60 km/h for 3 hr distance=?",
o:["180","150","200","210"],
c:0
},

{
q:"Ratio 45:60=?",
o:["3:4","4:5","5:6","2:3"],
c:0
},

{
q:"15 workers finish work in 20 days. 10 workers take?",
o:["30","25","20","35"],
c:0
},

{
q:"Square of 45=?",
o:["2025","2125","1925","2225"],
c:0
},

{
q:"Area of triangle b=12 h=8?",
o:["48","96","40","56"],
c:0
},

{
q:"Value of (18×14)÷6=?",
o:["42","40","44","48"],
c:0
},

{
q:"Discount% on MP=1000 SP=850?",
o:["15%","20%","25%","10%"],
c:0
},

{
q:"If A:B=3:5 and B=40 then A=?",
o:["24","20","18","30"],
c:0
},

{
q:"Boat speed=20 stream=5 downstream=?",
o:["25","20","15","30"],
c:0
},

{
q:"Volume of cube side 6?",
o:["216","196","256","186"],
c:0
},

{
q:"180÷0.5=?",
o:["360","180","90","720"],
c:0
},

{
q:"A train 240m crosses pole in 12 sec speed?",
o:["72 km/h","60 km/h","80 km/h","90 km/h"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
