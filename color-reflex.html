<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Color Reflex Game – Test Your Speed & Focus
</title>

<meta
name="description"

content=

"Play Color Reflex Game online and test your reaction speed and focus.">

<meta
name="keywords"

content=

"color reflex,reaction game,color game,focus challenge">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}

body{

background:

linear-gradient(
135deg,
#020617,
#051d38,
#1f1147
);

color:white;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:560px;

width:100%;

padding:30px;

text-align:center;

border-radius:35px;

background:

rgba(
255,
255,
255,
.06
);

backdrop-filter:

blur(20px);

box-shadow:

0 0 90px

#00d9ff44;

}

h1{

font-size:38px;

margin-bottom:20px;

}

#colorBox{

height:230px;

border-radius:30px;

margin:20px 0;

display:flex;

justify-content:center;

align-items:center;

font-size:40px;

font-weight:bold;

transition:.25s;

}

.grid{

display:grid;

grid-template-columns:

repeat(2,1fr);

gap:12px;

}

.opt{

padding:18px;

border:none;

border-radius:20px;

font-size:22px;

color:white;

}

.top{

display:flex;

justify-content:space-around;

margin-bottom:15px;

font-size:22px;

}

</style>

</head>

<body>

<div class="box">

<h1>

🧪 Color Reflex

</h1>

<div class="top">

<div>

⏱

<span id="time">

30

</span>

</div>

<div>

🏆

<span id="score">

0

</span>

</div>

<div>

🔥

<span id="best">

0

</span>

</div>

</div>

<div id="colorBox">

START

</div>

<div class="grid">

<button
class="opt"
onclick="pick('red')"
style="background:red">

RED

</button>

<button
class="opt"
onclick="pick('blue')"
style="background:blue">

BLUE

</button>

<button
class="opt"
onclick="pick('green')"
style="background:green">

GREEN

</button>

<button
class="opt"
onclick="pick('yellow')"
style="background:#d4aa00">

YELLOW

</button>

</div>

</div>

<script>

let colors=[

"red",
"blue",
"green",
"yellow"

];

let current="";

let score=0;

let time=30;

let started=false;

let best=

localStorage

.getItem(

"bestColor"

)

||

0;

document

.getElementById(

"best"

)

.innerHTML=

best;

function next(){

current=

colors[

Math.floor(

Math.random()

*4

)

];

let box=

document

.getElementById(

"colorBox"

);

box.style.background=

current;

box.innerHTML=

current

.toUpperCase();

}

function start(){

started=true;

next();

let x=

setInterval(

()=>{

time--;

document

.getElementById(

"time"

)

.innerHTML=

time;

if(

time<=0

){

clearInterval(

x

);

started=false;

document

.getElementById(

"colorBox"

)

.innerHTML=

`🏆 ${score}`;

if(

score>

best

){

best=score;

localStorage

.setItem(

"bestColor",

best

);

document

.getElementById(

"best"

)

.innerHTML=

best;

}

}

},

1000

);

}

function pick(v){

if(

!started

){

start();

return;

}

if(

v===current

){

score++;

document

.getElementById(

"score"

)

.innerHTML=

score;

}

next();

}

</script>

</body>

</html>
