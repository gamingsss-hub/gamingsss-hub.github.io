<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Puzzle Quiz | Brain Challenge
</title>

<meta
name="description"
content="Solve puzzle questions and test your brain power.">

<meta
name="keywords"
content="Puzzle Quiz, Brain Game, Logic Quiz">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050816,
#081426,
#000
);

color:white;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.box{

width:100%;
max-width:800px;

padding:35px;

border-radius:30px;

background:

rgba(255,255,255,.05);

backdrop-filter:blur(20px);

}

h1{

text-align:center;

color:#00ddff;

}

.level{

text-align:center;

margin-top:10px;

}

.progress{

height:10px;

background:#222;

border-radius:20px;

margin:25px 0;

}

.fill{

height:100%;

width:0%;

background:

linear-gradient(
90deg,
cyan,
blue
);

border-radius:20px;

}

.question{

font-size:28px;

margin-bottom:25px;

}

input{

width:100%;

padding:18px;

border:none;

border-radius:15px;

font-size:20px;

}

button{

margin-top:20px;

width:100%;

padding:18px;

border:none;

border-radius:15px;

font-size:20px;

background:

linear-gradient(
90deg,
#00ccff,
#0066ff
);

color:white;

}

.score{

margin-top:20px;

font-size:22px;

text-align:center;

}

</style>

</head>

<body>

<div class="box">

<h1>
🧩 Puzzle Quiz
</h1>

<div class="level">
Level:
<span id="lvl">
Easy
</span>
</div>

<div class="progress">

<div
class="fill"
id="fill">
</div>

</div>

<div
class="question"
id="q">
Loading...
</div>

<input
id="ans">

<button
onclick="check()">

Next

</button>

<div
class="score"
id="score">

Score:0

</div>

</div>

<script>

const data=[

{
q:"What has keys but no locks?",
a:"keyboard"
},

{
q:"What gets wetter while drying?",
a:"towel"
},

{
q:"What belongs to you but others use more?",
a:"name"
},

{
q:"What comes once in minute twice in moment?",
a:"m"
},

{
q:"I speak without mouth. What am I?",
a:"echo"
},

{
q:"Forward I am heavy backward not. What am I?",
a:"ton"
},

{
q:"What has one eye but cannot see?",
a:"needle"
},

{
q:"What has hands but cannot clap?",
a:"clock"
},

{
q:"What has cities but no people?",
a:"map"
},

{
q:"The more you take the more you leave?",
a:"footsteps"
}

];

let i=0;

let s=0;

function level(){

if(i<3)
return "Easy";

if(i<7)
return "Medium";

return "Hard";

}

function load(){

if(i>=data.length){

document.body.innerHTML=

`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-size:40px;
color:white;
">

🏆 Finished

<br><br>

Score:
${s}/10

</div>

`;

return;

}

q.innerHTML=data[i].q;

lvl.innerHTML=level();

fill.style.width=

(i*10)+"%";

ans.value="";

}

function check(){

let v=

ans.value

.toLowerCase()

.trim();

if(

v===

data[i].a

){

s++;

}

score.innerHTML=

"Score: "+s;

i++;

load();

}

load();

</script>

</body>

</html>
