<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= CSAT 25 REAL ================= */
add("CSAT",[
{
q:"If A=2, B=4, C=6 then CAT=?",
o:["48","44","40","52"],
c:0
},

{
q:"A train travels 240 km in 4 hr. Speed=?",
o:["60","50","80","40"],
c:0
},

{
q:"Series: 2 5 11 23 47 ?",
o:["95","93","91","97"],
c:0
},

{
q:"A is taller than B. B taller than C. Who shortest?",
o:["C","A","B","Cannot say"],
c:0
},

{
q:"25% of 640=?",
o:["160","150","180","140"],
c:0
},

{
q:"A can do work in 10 days. B in 15 days. Together?",
o:["6 days","8 days","12 days","5 days"],
c:0
},

{
q:"Series: 3 6 12 24 ?",
o:["48","36","42","50"],
c:0
},

{
q:"Clock angle at 3:30?",
o:["75°","90°","60°","45°"],
c:0
},

{
q:"Boat speed=20 km/h stream=5. Downstream=?",
o:["25","15","20","30"],
c:0
},

{
q:"Find odd one",
o:["Triangle","Square","Circle","Potato"],
c:3
},

{
q:"If 5 men finish work in 20 days, 10 men take?",
o:["10","15","8","12"],
c:0
},

{
q:"Series: Z X V T ?",
o:["R","S","Q","P"],
c:0
},

{
q:"Average of 18,24,30,36,42=?",
o:["30","32","28","34"],
c:0
},

{
q:"Mirror time of 4:40?",
o:["7:20","8:20","6:20","5:20"],
c:0
},

{
q:"Coding DOG=EPH CAT=?",
o:["DBU","CBU","CAU","DAU"],
c:0
},

{
q:"Simple Interest on ₹2000 at 10% for 2 years?",
o:["400","300","500","200"],
c:0
},

{
q:"Series: 1 4 9 16 ?",
o:["25","20","36","49"],
c:0
},

{
q:"Distance=120 km Speed=40 km/h Time=?",
o:["3 hr","2 hr","4 hr","5 hr"],
c:0
},

{
q:"If all apples are fruits and some fruits are mangoes?",
o:["Some apples are fruits","All mangoes apples","No fruit","None"],
c:0
},

{
q:"Ratio 18:24=?",
o:["3:4","2:3","4:5","5:6"],
c:0
},

{
q:"Area of circle?",
o:["πr²","2πr","a²","l×b"],
c:0
},

{
q:"Book:Read :: Food:?",
o:["Eat","Write","Cook","Draw"],
c:0
},

{
q:"A man walks North then right. Direction?",
o:["East","West","South","North"],
c:0
},

{
q:"Probability of getting 6 on dice?",
o:["1/6","1/2","1/3","1/4"],
c:0
},

{
q:"Cube root of 4913=?",
o:["17","16","18","15"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
