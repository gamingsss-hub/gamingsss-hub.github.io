<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text Case Converter | Toolora</title>

<meta name="description" content="Convert text into UPPERCASE, lowercase, Sentence Case, Title Case and Toggle Case instantly.">

<meta name="keywords" content="text case converter, uppercase converter, lowercase converter, title case">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.container{

width:100%;

max-width:900px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

padding:30px;

color:white;

box-shadow:0 20px 60px rgba(0,0,0,.4);

}

h1{

text-align:center;

margin-bottom:10px;

font-size:38px;

}

.sub{

text-align:center;

color:#d1d5db;

margin-bottom:25px;

}

textarea{

width:100%;

height:220px;

background:#111827;

border:none;

border-radius:18px;

padding:18px;

color:white;

font-size:17px;

outline:none;

resize:none;

margin-bottom:20px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}

button{

padding:16px;

border:none;

border-radius:15px;

cursor:pointer;

font-size:16px;

font-weight:700;

background:linear-gradient(45deg,#2563eb,#7c3aed);

color:white;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

}

.stats{

margin-top:25px;

display:flex;

justify-content:space-between;

background:#111827;

padding:18px;

border-radius:15px;

font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<h1>📝 Text Case Converter</h1>

<p class="sub">

Convert your text instantly into different formats.

</p>

<textarea
id="text"
placeholder="Type or Paste your text here..."></textarea>

<div class="grid">

<button onclick="toUpper()">
🔠 UPPERCASE
</button>

<button onclick="toLower()">
🔡 lowercase
</button>

<button onclick="toTitle()">
📖 Title Case
</button>

<button onclick="toSentence()">
✍ Sentence Case
</button>

<button onclick="toggleCase()">
🔄 Toggle Case
</button>

<button onclick="copyText()">
📋 Copy
</button>

<button onclick="clearText()">
🗑 Clear
</button>

</div>

<div class="stats">

<div>
Characters :
<span id="chars">0</span>
</div>

<div>
Words :
<span id="words">0</span>
</div>

</div>

  <script>

const text=document.getElementById("text");
const chars=document.getElementById("chars");
const words=document.getElementById("words");

// ===== Live Count =====

text.addEventListener("input",updateStats);

function updateStats(){

chars.innerHTML=text.value.length;

const wordCount=text.value.trim()===""
?0
:text.value.trim().split(/\s+/).length;

words.innerHTML=wordCount;

}

// ===== UPPERCASE =====

function toUpper(){

text.value=text.value.toUpperCase();

updateStats();

}

// ===== lowercase =====

function toLower(){

text.value=text.value.toLowerCase();

updateStats();

}

// ===== Title Case =====

function toTitle(){

text.value=text.value
.toLowerCase()
.replace(/\b\w/g,c=>c.toUpperCase());

updateStats();

}

// ===== Sentence Case =====

function toSentence(){

let t=text.value.toLowerCase();

text.value=t.charAt(0).toUpperCase()+t.slice(1);

updateStats();

}

// ===== Toggle Case =====

function toggleCase(){

let result="";

for(let ch of text.value){

result+=

ch===ch.toUpperCase()

?ch.toLowerCase()

:ch.toUpperCase();

}

text.value=result;

updateStats();

}

// ===== Copy =====

function copyText(){

if(text.value==="") return;

navigator.clipboard.writeText(text.value);

alert("✅ Text Copied");

}

// ===== Clear =====

function clearText(){

text.value="";

updateStats();

}

updateStats();

</script>

</div>

</body>

</html>
