<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= BASKETBALL 25 REAL ================= */
add("BASKETBALL",[
{
q:"How many players per team on court?",
o:["5","6","7","8"],
c:0
},
{
q:"Which country invented basketball?",
o:["USA","Canada","UK","France"],
c:1
},
{
q:"Who invented basketball?",
o:["James Naismith","Michael Jordan","Kobe Bryant","LeBron James"],
c:0
},
{
q:"NBA stands for?",
o:["National Basketball Association","New Ball Association","National Basket Agency","None"],
c:0
},
{
q:"Points for normal field goal?",
o:["1","2","3","4"],
c:1
},
{
q:"Points for free throw?",
o:["1","2","3","4"],
c:0
},
{
q:"Points for long-range shot?",
o:["2","3","4","5"],
c:1
},
{
q:"Basketball hoop height?",
o:["8 ft","10 ft","12 ft","15 ft"],
c:1
},
{
q:"How many quarters in NBA game?",
o:["2","3","4","5"],
c:2
},
{
q:"Shot clock duration (NBA)?",
o:["20 sec","24 sec","30 sec","35 sec"],
c:1
},
{
q:"Which player known as King James?",
o:["Jordan","Curry","LeBron James","Durant"],
c:2
},
{
q:"Who has most NBA championships as player?",
o:["Bill Russell","Jordan","Kobe","Magic"],
c:0
},
{
q:"Which player known for Air Jordan?",
o:["Jordan","Kobe","Curry","Shaq"],
c:0
},
{
q:"Court center action begins with?",
o:["Throw","Jump Ball","Kick","Pass"],
c:1
},
{
q:"Maximum personal fouls before disqualification (NBA)?",
o:["4","5","6","7"],
c:2
},
{
q:"Which country won Olympic basketball most times?",
o:["USA","Spain","France","Brazil"],
c:0
},
{
q:"What is dribbling?",
o:["Running","Bouncing ball","Jumping","Throwing"],
c:1
},
{
q:"Backboard is attached to?",
o:["Net","Hoop","Basket","Pole"],
c:1
},
{
q:"Which player called Black Mamba?",
o:["Jordan","Kobe Bryant","LeBron","Shaq"],
c:1
},
{
q:"How many seconds to cross half court (NBA)?",
o:["6","8","10","12"],
c:1
},
{
q:"Which league is most famous?",
o:["NBA","IPL","MLS","EPL"],
c:0
},
{
q:"Triple-double means?",
o:["3 fouls","3 stats in double digits","30 points","3 wins"],
c:1
},
{
q:"Basket diameter approx?",
o:["18 inch","20 inch","15 inch","25 inch"],
c:0
},
{
q:"Which player known for 3-pointers?",
o:["Stephen Curry","Shaq","Jordan","Duncan"],
c:0
},
{
q:"Basketball became Olympic sport in?",
o:["1936","1940","1952","1960"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
