<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Guess The Flag Quiz 2026 | World Flags Challenge | QuizEmpire

</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}

body{

background:
linear-gradient(
135deg,
#061425,
#14335f
);

color:white;

padding:20px;

text-align:center;

}

.container{

max-width:520px;

margin:auto;

background:#102748;

padding:25px;

border-radius:25px;

box-shadow:
0 20px 50px
rgba(0,0,0,.3);

}

h1{

margin-bottom:20px;

}

#flag{

font-size:120px;

margin:15px;

}

.sub{

opacity:.8;

margin-bottom:20px;

}

.opt{

width:100%;

padding:16px;

margin:10px 0;

border:none;

border-radius:14px;

font-size:18px;

cursor:pointer;

background:#1d4ed8;

color:white;

}

.opt:hover{

transform:scale(.98);

}

#result{

margin-top:18px;

font-size:22px;

}

.info{

margin-top:20px;

display:flex;

justify-content:space-between;

}

.end{

font-size:35px;

margin-top:100px;

}

</style>

</head>

<body>

<div class="container">

<h1>

🌍 Guess The Flag

</h1>

<div id="flag"></div>

<div class="sub">

Guess the country

</div>

<div id="options"></div>

<div id="result"></div>

<div class="info">

<div>

🏆 Score:
<span id="score">

0

</span>

</div>

<div>

📍
<span id="progress">

1/15

</span>

</div>

</div>

</div>

<script>

let score=0;

let current=0;

const right=

new Audio(

"https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"

);

const wrong=

new Audio(

"https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"

);

const quiz=[

["🇮🇳","India"],
["🇺🇸","USA"],
["🇬🇧","United Kingdom"],
["🇧🇷","Brazil"],
["🇯🇵","Japan"],

["🇩🇪","Germany"],
["🇫🇷","France"],
["🇨🇦","Canada"],
["🇰🇷","South Korea"],
["🇦🇺","Australia"],

["🇲🇽","Mexico"],
["🇨🇳","China"],
["🇪🇸","Spain"],
["🇮🇹","Italy"],
["🇷🇺","Russia"]

];

/*

ADD MORE:

["🇳🇵","Nepal"],

*/

function shuffle(x){

return x.sort(
()=>Math.random()-.5
);

}

function load(){

document

.getElementById(

"flag"

)

.innerHTML=

quiz[current][0];

document

.getElementById(

"progress"

)

.innerHTML=

`${current+1}/15`;

document

.getElementById(

"result"

)

.innerHTML="";

let correct=

quiz[current][1];

let options=

shuffle([

correct,

...shuffle(

quiz

.filter(

x=>

x[1]!==correct

)

.slice(0,3)

.map(

x=>x[1]

)

)

]);

let html="";

options.forEach(v=>{

html+=

`

<button
class="opt"

onclick=

"check('${v}')">

${v}

</button>

`;

});

document

.getElementById(

"options"

)

.innerHTML=

html;

}

function check(v){

let correct=

quiz[current][1];

if(

v===correct

){

right.play();

score++;

document

.getElementById(

"result"

)

.innerHTML=

"✅ Correct";

}

else{

wrong.play();

document

.getElementById(

"result"

)

.innerHTML=

"❌ "+correct;

}

document

.getElementById(

"score"

)

.innerHTML=

score;

setTimeout(

()=>{

current++;

if(

current<quiz.length

){

load();

}

else{

document.body.innerHTML=

`

<div class="end">

🏆

<br><br>

Final Score

<br>

${score}/15

</div>

`;

}

},

1200

);

}

load();

</script>

</body>

</html>
