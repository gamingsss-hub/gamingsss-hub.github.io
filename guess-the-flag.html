```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Guess The Flag Quiz 2026 | World Flags Challenge | QuizEmpire
</title>

<meta
name="description"
content="Play Guess The Flag Quiz and identify country flags from around the world.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:linear-gradient(135deg,#071320,#122844);

padding:20px;

color:white;

}

.top{

text-align:center;

margin-bottom:25px;

}

.top h1{

font-size:34px;

}

.top p{

opacity:.8;

margin-top:8px;

}

.card{

background:#122c4f;

border-radius:22px;

padding:25px;

max-width:500px;

margin:auto;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.3);

}

.flag{

font-size:100px;

margin:20px 0;

}

button{

width:100%;

padding:16px;

margin-top:12px;

border:none;

border-radius:15px;

font-size:17px;

font-weight:bold;

cursor:pointer;

background:#1d4ed8;

color:white;

}

button:hover{

transform:scale(.98);

}

#result{

margin-top:20px;

font-size:22px;

}

.score{

margin-top:18px;

font-size:18px;

}

.next{

background:#16a34a;

display:none;

}

</style>

</head>

<body>

<div class="top">

<h1>🌍 Guess The Flag</h1>

<p>Choose the correct country</p>

</div>

<div class="card">

<div id="flag" class="flag">
🇮🇳
</div>

<div id="options"></div>

<div id="result"></div>

<div class="score">

Score:
<span id="score">
0
</span>

</div>

<button
class="next"
onclick="nextQuiz()">

Next

</button>

</div>

<script>

let score=0;

let index=0;

const quiz=[

{
flag:"🇮🇳",
correct:"India",
options:[
"India",
"Brazil",
"Japan",
"Italy"
]
},

{
flag:"🇺🇸",
correct:"USA",
options:[
"UK",
"USA",
"Canada",
"France"
]
},

{
flag:"🇯🇵",
correct:"Japan",
options:[
"Japan",
"China",
"Korea",
"India"
]
},

{
flag:"🇧🇷",
correct:"Brazil",
options:[
"Brazil",
"Spain",
"Mexico",
"Argentina"
]
},

{
flag:"🇩🇪",
correct:"Germany",
options:[
"Germany",
"Belgium",
"France",
"Russia"
]
}

];

function loadQuiz(){

document.getElementById("result").innerHTML="";

document.querySelector(".next").style.display="none";

document.getElementById("flag").innerHTML=

quiz[index].flag;

let html="";

quiz[index].options.forEach(o=>{

html+=`

<button
onclick="check('${o}')">

${o}

</button>

`;

});

document.getElementById("options").innerHTML=

html;

}

function check(ans){

if(
ans===quiz[index].correct
){

score++;

document.getElementById("score")

.innerHTML=score;

document.getElementById("result")

.innerHTML="✅ Correct";

}

else{

document.getElementById("result")

.innerHTML=

"❌ "+quiz[index].correct;

}

document.querySelector(".next")

.style.display="block";

}

function nextQuiz(){

index++;

if(
index>=quiz.length
){

document.body.innerHTML=

`

<div class='top'>

<h1>

🏆 Final Score

</h1>

<h2>

${score}/${quiz.length}

</h2>

</div>

`;

return;

}

loadQuiz();

}

loadQuiz();

</script>

</body>

</html>
```
