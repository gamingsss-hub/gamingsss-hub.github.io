<script>

let score=0;

let current=0;

const correctSound=
new Audio(
"https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"
);

const wrongSound=
new Audio(
"https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"
);

const quiz=[

["🇮🇳","India"],
["🇺🇸","USA"],
["🇯🇵","Japan"],
["🇧🇷","Brazil"],
["🇫🇷","France"],
["🇩🇪","Germany"],
["🇨🇦","Canada"],
["🇬🇧","United Kingdom"],
["🇦🇺","Australia"],
["🇰🇷","South Korea"]

];

function shuffle(a){

return a.sort(()=>Math.random()-0.5);

}

function load(){

document.getElementById("result")

.innerHTML="";

let q=quiz[current];

document.getElementById("flag")

.innerHTML=`

<div style="font-size:120px">

${q[0]}

</div>

<div
style="margin-top:10px;
font-size:18px;
opacity:.8">

Guess This Flag

</div>
let arr=

shuffle([

q[1],

...shuffle(

quiz

.filter(x=>x[1]!=q[1])

.slice(0,3)

.map(x=>x[1])

)

]);

let html="";

arr.forEach(v=>{

html+=`

<button
onclick="check('${v}')">

${v}

</button>

`;

});

document.getElementById("options")

.innerHTML=html;

}

function check(v){

let correct=

quiz[current][1];

if(v===correct){

correctSound.play();

score++;

document.getElementById("result")

.innerHTML=

"✅ Correct";

}

else{

wrongSound.play();

document.getElementById("result")

.innerHTML=

"❌ "+correct;

}

document.getElementById("score")

.innerHTML=score;

setTimeout(()=>{

current++;

if(current<quiz.length){

load();

}

else{

document.body.innerHTML=

`

<h1>

🏆 Final Score

</h1>

<h2>

${score}/10

</h2>

`;

}

},1000);

}

load();

</script>

</body>
