<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Riddle Quiz | Mind Challenge

</title>

<meta
name="description"

content="Solve tricky riddles and improve your thinking skills">

<meta
name="keywords"

content="riddle quiz,puzzle,brain">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050816,
#081b38,
black
);

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

padding:20px;

}

.box{

width:100%;

max-width:850px;

padding:35px;

border-radius:30px;

background:
rgba(255,255,255,.05);

}

h1{

text-align:center;

color:#00ddff;

margin-bottom:20px;

}

#q{

font-size:30px;

margin-bottom:25px;

}

input{

width:100%;

padding:18px;

border:none;

border-radius:15px;

font-size:20px;

}

.row{

display:flex;

gap:10px;

margin-top:20px;

}

button{

flex:1;

padding:18px;

border:none;

border-radius:15px;

font-size:18px;

color:white;

}

.check{

background:#0066ff;

}

.hint{

background:#ff8800;

}

.skip{

background:#555;

}

.stats{

margin-top:20px;

font-size:22px;

text-align:center;

}

</style>

</head>

<body>

<div class="box">

<h1>

🧠 Riddle Quiz

</h1>

<div id="q">

Loading...

</div>

<input id="ans">

<div class="row">

<button
class="check"
onclick="check()">

Next

</button>

<button
class="hint"
onclick="showHint()">

Hint

</button>

<button
class="skip"
onclick="skip()">

Skip

</button>

</div>

<div
class="stats"
id="stats">

Score:0

</div>

</div>

<script>

const data=[

{
q:"I have branches but no fruit, trunk or leaves. What am I?",
a:"bank"
},

{
q:"What has many teeth but cannot bite?",
a:"comb"
},

{
q:"What can travel around the world while staying in one corner?",
a:"stamp"
},

{
q:"What has an eye but cannot see?",
a:"needle"
},

{
q:"What comes down but never goes up?",
a:"rain"
},

{
q:"What has a neck but no head?",
a:"bottle"
},

{
q:"What has one head one foot and four legs?",
a:"bed"
},

{
q:"What can fill a room but takes no space?",
a:"light"
},

{
q:"What breaks but never falls and falls but never breaks?",
a:"day"
},

{
q:"What has words but never speaks?",
a:"book"
},

{
q:"What invention lets you look through walls?",
a:"window"
},

{
q:"The more of me you take the more you leave behind. What am I?",
a:"footsteps"
},

{
q:"What has hands but cannot clap?",
a:"clock"
},

{
q:"What goes up and down but stays in same place?",
a:"stairs"
},

{
q:"What is full of holes but still holds water?",
a:"sponge"
}

];


let i=0;

let score=0;

function load(){

if(i>=riddles.length){

document.body.innerHTML=

`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-size:40px;
color:white;
">

🏆 Finished

<br><br>

Score:
${score}/${riddles.length}

</div>
`;

return;

}

q.innerHTML=riddles[i][0];

ans.value="";

}

function check(){

if(

ans.value
.toLowerCase()
.trim()

===

riddles[i][1]

){

score++;

}

stats.innerHTML=

"Score: "+score;

i++;

load();

}

function showHint(){

alert(

"Hint: "+riddles[i][2]

);

}

function skip(){

i++;

load();

}

load();

</script>

</body>

</html>
