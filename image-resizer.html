<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Resizer | Resize JPG, PNG & WEBP Online | Toolora</title>

<meta name="description" content="Resize JPG, PNG & WEBP images online for free. Change image width, height or resize by percentage while maintaining quality.">

<meta name="keywords" content="image resizer, resize image, jpg resizer, png resizer, online image resize, toolora">

<link rel="icon" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(135deg,#050816,#111827,#1e3a8a,#7c3aed);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

color:white;

}

.container{

width:100%;
max-width:950px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:30px;

padding:35px;

border:1px solid rgba(255,255,255,.12);

box-shadow:0 20px 60px rgba(0,0,0,.4);

}

h1{

font-size:38px;
text-align:center;

margin-bottom:10px;

}

.sub{

text-align:center;

color:#d1d5db;

margin-bottom:35px;

}

.upload{

border:3px dashed #60a5fa;

border-radius:25px;

padding:45px;

text-align:center;

cursor:pointer;

transition:.3s;

}

.upload:hover{

background:rgba(255,255,255,.05);

}

.upload h2{

margin-top:18px;

font-size:28px;

}

.upload p{

margin-top:10px;

color:#cbd5e1;

}

input[type=file]{

display:none;

}

.preview{

display:none;

margin-top:35px;

grid-template-columns:1fr 1fr;

gap:25px;

}

.box{

background:#111827;

padding:20px;

border-radius:20px;

text-align:center;

}

.box img{

width:100%;

max-height:300px;

object-fit:contain;

background:black;

border-radius:15px;

}

.box h3{

margin:15px 0;

}

.controls{

display:none;

margin-top:30px;

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:20px;

}

.row input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:15px;

background:#111827;

color:white;

font-size:16px;

}

.check{

display:flex;

align-items:center;

gap:10px;

margin-bottom:20px;

font-size:17px;

}

.buttons{

display:flex;

gap:15px;

}

.buttons button{

flex:1;

padding:18px;

border:none;

border-radius:18px;

font-size:17px;

font-weight:700;

cursor:pointer;

}

.resizeBtn{

background:linear-gradient(45deg,#2563eb,#7c3aed);

color:white;

}

.downloadBtn{

background:#22c55e;

color:white;

display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>🖼 Image Resizer</h1>

<p class="sub">

Resize JPG, PNG & WEBP Images Easily

</p>

<label class="upload">

<input
type="file"
id="imageInput"
accept="image/*">

<div style="font-size:70px">

📤

</div>

<h2>

Choose Image

</h2>

<p>

Click here to upload your image

</p>

</label>

<div
class="preview"
id="preview">

<div class="box">

<h3>Original</h3>

<img id="originalImage">

</div>

<div class="box">

<h3>Preview</h3>

<img id="previewImage">

</div>

</div>

<div
class="controls"
id="controls">

<div class="row">

<input
type="number"
id="width"
placeholder="Width (px)">

<input
type="number"
id="height"
placeholder="Height (px)">

</div>

<div class="check">

<input
type="checkbox"
id="lockRatio"
checked>

<label>

Keep Aspect Ratio

</label>

</div>

<div class="buttons">

<button
class="resizeBtn"
id="resizeBtn">

📏 Resize Image

</button>

<button
class="downloadBtn"
id="downloadBtn">

⬇ Download

</button>

</div>

</div>

  <script>

const imageInput=document.getElementById("imageInput");

const preview=document.getElementById("preview");

const controls=document.getElementById("controls");

const originalImage=document.getElementById("originalImage");

const previewImage=document.getElementById("previewImage");

const widthInput=document.getElementById("width");

const heightInput=document.getElementById("height");

const lockRatio=document.getElementById("lockRatio");

const resizeBtn=document.getElementById("resizeBtn");

const downloadBtn=document.getElementById("downloadBtn");

let originalWidth=0;
let originalHeight=0;

let resizedDataURL="";

// ========= Upload Image =========

imageInput.addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

originalImage.src=e.target.result;
previewImage.src=e.target.result;

preview.style.display="grid";
controls.style.display="block";

const img=new Image();

img.onload=function(){

originalWidth=img.width;
originalHeight=img.height;

widthInput.value=originalWidth;
heightInput.value=originalHeight;

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});

// ========= Keep Aspect Ratio =========

widthInput.addEventListener("input",()=>{

if(lockRatio.checked){

heightInput.value=Math.round(

(widthInput.value/originalWidth)*originalHeight

);

}

});

heightInput.addEventListener("input",()=>{

if(lockRatio.checked){

widthInput.value=Math.round(

(heightInput.value/originalHeight)*originalWidth

);

}

});

// ========= Resize =========

resizeBtn.addEventListener("click",()=>{

const canvas=document.createElement("canvas");

const ctx=canvas.getContext("2d");

canvas.width=widthInput.value;
canvas.height=heightInput.value;

const img=new Image();

img.onload=function(){

ctx.drawImage(img,0,0,canvas.width,canvas.height);

resizedDataURL=canvas.toDataURL("image/png");

previewImage.src=resizedDataURL;

downloadBtn.style.display="block";

};

img.src=originalImage.src;

});

// ========= Download =========

downloadBtn.addEventListener("click",()=>{

if(!resizedDataURL) return;

const link=document.createElement("a");

link.href=resizedDataURL;

link.download="toolora-resized-image.png";

link.click();

showToast("✅ Image Download Started");

});


// ========= Toast =========

function showToast(message){

const toast=document.createElement("div");

toast.innerHTML=message;

toast.style.position="fixed";
toast.style.bottom="20px";
toast.style.right="20px";
toast.style.background="#22c55e";
toast.style.color="#fff";
toast.style.padding="14px 20px";
toast.style.borderRadius="15px";
toast.style.fontWeight="600";
toast.style.boxShadow="0 10px 30px rgba(0,0,0,.35)";
toast.style.zIndex="9999";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2000);

}


// ========= Drag & Drop =========

const upload=document.querySelector(".upload");

upload.addEventListener("dragover",(e)=>{

e.preventDefault();

upload.style.borderColor="#22c55e";

});

upload.addEventListener("dragleave",()=>{

upload.style.borderColor="#60a5fa";

});

upload.addEventListener("drop",(e)=>{

e.preventDefault();

upload.style.borderColor="#60a5fa";

imageInput.files=e.dataTransfer.files;

imageInput.dispatchEvent(new Event("change"));

});

</script>

</div>

</body>
</html>
