<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free AI Code Generator | Toolora AI</title>

<meta name="description" content="Generate HTML, CSS, JavaScript, Python, Java, C++, PHP and more using Toolora AI Code Generator.">

<meta name="keywords" content="AI Code Generator, AI Coding Assistant, HTML Generator, JavaScript AI, Python AI, Toolora AI">

<link rel="preconnect" href="https://fonts.googleapis.com">

<div class="bg"></div>

id="prompt"
placeholder="Example: Create a responsive login page using HTML, CSS and JavaScript"></textarea>

🚀 Generate Code
</button>

</div>

<!-- RIGHT PANEL -->

<div class="right-panel">

<div class="toolbar">

📋 Copy
</button>

<button id="download">
📥 Download
</button>

🔄 Regenerate
