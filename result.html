<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz Result</title>

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{

background:#1e293b;

padding:35px;

border-radius:25px;

text-align:center;

width:90%;

max-width:420px;

}

h1{

color:#00e6ff;

}

.score{

font-size:55px;

margin:20px;

}

.pass{

color:#00ff7b;

}

.fail{

color:red;

}

.btn{

display:inline-block;

margin-top:20px;

padding:14px 30px;

background:#00e6ff;

color:black;

text-decoration:none;

border-radius:12px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h1>🏆 Result</h1>

<div class="score"
id="score">

0%

</div>

<h2 id="status"></h2>

<a
class="btn"
href="index.html">

Home

</a>

</div>

<script>

let score=
localStorage.getItem(
"score"
)||0;

document
.getElementById(
"score"
)
.innerHTML=
score+"%";

if(score>=40){

status.innerHTML=
"PASS ✅";

status.className=
"pass";

}else{

status.innerHTML=
"FAIL ❌";

status.className=
"fail";

}

</script>

</body>

</html>
