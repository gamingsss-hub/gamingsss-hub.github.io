<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= ENGLISH 25 REAL ================= */
add("ENGLISH",[
{
q:"Series: 2,5,10,17,?",
o:["24","26","28","30"],
c:1
},
{
q:"Series: 1,4,9,16,?",
o:["20","25","30","36"],
c:1
},
{
q:"Series: 3,6,12,24,?",
o:["36","48","50","60"],
c:1
},
{
q:"Find next: 7,14,21,?",
o:["25","28","35","42"],
c:1
},
{
q:"Series: 2,6,12,20,?",
o:["28","30","32","34"],
c:1
},
{
q:"Missing number: 5,10,20,40,?",
o:["60","70","80","90"],
c:2
},
{
q:"Series: 81,27,9,3,?",
o:["1","2","0","4"],
c:0
},
{
q:"Find next: 13,16,19,22,?",
o:["24","25","26","27"],
c:1
},
{
q:"Series: 1,8,27,64,?",
o:["100","125","144","216"],
c:1
},
{
q:"Series: 2,3,5,8,13,?",
o:["18","19","20","21"],
c:3
},
{
q:"Find next: 10,20,30,?",
o:["35","40","45","50"],
c:1
},
{
q:"Series: 100,95,90,?",
o:["80","85","75","70"],
c:1
},
{
q:"Find missing: 4,9,16,25,?",
o:["30","36","49","64"],
c:1
},
{
q:"Series: 11,22,44,88,?",
o:["132","176","166","188"],
c:1
},
{
q:"Find next: 1,2,6,24,?",
o:["48","96","120","144"],
c:2
},
{
q:"Series: 5,15,45,?",
o:["90","125","135","145"],
c:2
},
{
q:"Series: 50,45,40,?",
o:["30","35","25","20"],
c:1
},
{
q:"Find next: 2,8,18,32,?",
o:["40","50","60","72"],
c:1
},
{
q:"Series: 121,100,81,?",
o:["64","49","36","25"],
c:0
},
{
q:"Find next: 9,18,36,72,?",
o:["108","144","154","164"],
c:1
},
{
q:"Series: 14,28,56,?",
o:["84","96","112","124"],
c:2
},
{
q:"Series: 3,7,15,31,?",
o:["45","63","64","65"],
c:1
},
{
q:"Find next: 2,4,16,256,?",
o:["1024","2048","65536","4096"],
c:2
},
{
q:"Series: 6,12,24,48,?",
o:["72","96","84","108"],
c:1
},
{
q:"Find missing: 1,1,2,3,5,8,?",
o:["11","12","13","14"],
c:2
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
