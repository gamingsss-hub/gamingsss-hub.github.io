<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Word Counter – Toolora | Count Words Characters

</title>

<meta
name="description"
content="Toolora Word Counter. Count words, characters, reading time instantly.">

<meta
name="keywords"
content="word counter, character counter, text counter, toolora">

<link
rel="icon"
href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

min-height:100vh;

background:

linear-gradient(
145deg,
#0d0628,
#13092f,
#22074f
);

color:white;

padding:24px;

}

.box{

max-width:900px;

margin:auto;

padding:34px;

border-radius:36px;

background:

rgba(
255,
255,
255,
.05
);

backdrop-filter:

blur(
18px
);

}

.back{

color:#b9a7ff;

text-decoration:none;

}

.title{

font-size:52px;

font-weight:900;

margin:20px 0;

}

.sub{

color:#a8a5d6;

margin-bottom:30px;

}

textarea{

width:100%;

height:260px;

padding:24px;

border:none;

border-radius:26px;

background:

rgba(
255,
255,
255,
.06
);

color:white;

font-size:18px;

resize:none;

outline:none;

}

.stats{

display:grid;

grid-template-columns:

repeat(
4,
1fr
);

gap:16px;

margin-top:22px;

}

.card{

padding:22px;

border-radius:22px;

background:

rgba(
255,
255,
255,
.05
);

text-align:center;

}

.num{

font-size:34px;

font-weight:900;

color:#9f7cff;

}

.label{

margin-top:8px;

color:#c7c6e8;

}

button{

width:100%;

margin-top:20px;

padding:18px;

border:none;

border-radius:22px;

font-size:18px;

background:

linear-gradient(
45deg,
#7a5cff,
#4b8dff
);

color:white;

}

@media(max-width:700px){

.title{

font-size:38px;

}

.stats{

grid-template-columns:

repeat(
2,
1fr
);

}

}

</style>

</head>

<body>

<div class="box">

<a
href="utility.html"
class="back">

← Utility

</a>

<div class="title">

📝 Word Counter

</div>

<div class="sub">

Count words • characters • reading time

</div>

<textarea
id="text"
placeholder="Start typing..."
onkeyup="count()">

</textarea>

<div class="stats">

<div class="card">

<div
class="num"
id="words">

0

</div>

<div class="label">

Words

</div>

</div>

<div class="card">

<div
class="num"
id="chars">

0

</div>

<div class="label">

Characters

</div>

</div>

<div class="card">

<div
class="num"
id="read">

0

</div>

<div class="label">

Read Min

</div>

</div>

<div class="card">

<div
class="num"
id="space">

0

</div>

<div class="label">

Spaces

</div>

</div>

</div>

<button onclick="clearText()">

Clear

</button>

</div>

<script>

function count(){

let t=

text.value;

let words=

t.trim()

==''

?

0

:

t.trim()

.split(/\s+/)

.length;



words.innerHTML=
words;

document.getElementById(
"words"
).innerHTML=
words;

document.getElementById(
"chars"
).innerHTML=
t.length;

document.getElementById(
"space"
).innerHTML=

(

t.match(/ /g)

||

[]

).length;

document.getElementById(
"read"
).innerHTML=

Math.max(
1,
Math.ceil(
words/200
)

);

}



function clearText(){

text.value='';

count();

}

</script>

</body>

</html>
