<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Pattern Memory Game – Test Your Brain
</title>

<meta
name="description"

content=

"Play Pattern Memory Game online and remember glowing patterns to beat levels.">

<meta
name="keywords"

content=

"memory game,pattern game,brain game,sequence game">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:

linear-gradient(
135deg,
#020617,
#09142d,
#12062d
);

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.box{

text-align:center;

width:95%;

max-width:550px;

}

h1{

margin-bottom:15px;

}

.stats{

display:flex;

justify-content:space-around;

margin-bottom:20px;

font-size:22px;

}

.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:15px;

}

.cell{

height:140px;

border-radius:25px;

background:

rgba(
255,
255,
255,
.08
);

backdrop-filter:

blur(12px);

cursor:pointer;

transition:.2s;

}

.active{

background:

#00d9ff;

box-shadow:

0 0 60px

#00e5ff;

}

#msg{

margin-top:20px;

font-size:28px;

}

button{

margin-top:20px;

padding:16px 35px;

border:none;

border-radius:16px;

font-size:20px;

background:

linear-gradient(
90deg,
#00bfff,
#0055ff
);

color:white;

}

</style>

</head>

<body>

<div class="box">

<h1>

🌌 Pattern Memory

</h1>

<div class="stats">

<div>

🏆
<span id="level">

1

</span>

</div>

<div>

🔥
<span id="best">

0

</span>

</div>

</div>

<div class="grid">

<div class="cell"></div>

<div class="cell"></div>

<div class="cell"></div>

<div class="cell"></div>

</div>

<button
onclick="start()">

START

</button>

<div id="msg">

Watch Carefully

</div>

</div>

<script>

const cells=

document

.querySelectorAll(

".cell"

);

let pattern=[];

let user=[];

let level=1;

let best=

localStorage

.getItem(

"patternBest"

)

||

1;

document

.getElementById(

"best"

)

.innerHTML=

best;

function flash(i){

cells[i]

.classList

.add(

"active"

);

setTimeout(

()=>{

cells[i]

.classList

.remove(

"active"

);

},

500

);

}

function show(){

let i=0;

let x=

setInterval(

()=>{

flash(

pattern[i]

);

i++;

if(

i>=pattern.length

){

clearInterval(

x

);

}

},

700

);

}

function next(){

user=[];

pattern.push(

Math.floor(

Math.random()

*4

)

);

document

.getElementById(

"level"

)

.innerHTML=

level;

show();

}

function start(){

pattern=[];

level=1;

next();

}

cells.forEach(

(c,i)=>{

c.onclick=

()=>{

flash(i);

user.push(i);

let x=

user.length-1;

if(

user[x]

!==

pattern[x]

){

document

.getElementById(

"msg"

)

.innerHTML=

"💀 Game Over";

if(

level>

best

){

best=level;

localStorage

.setItem(

"patternBest",

best

);

document

.getElementById(

"best"

)

.innerHTML=

best;

}

return;

}

if(

user.length===

pattern.length

){

level++;

document

.getElementById(

"msg"

)

.innerHTML=

"✅ Level Up";

setTimeout(

next,

1000

);

}

};

}

);

</script>

</body>

</html>
