<script>

function updateClocks(){

const from=document.getElementById("fromZone").value;

const to=document.getElementById("toZone").value;

const now=new Date();



const optTime={

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

};



const optDate={

weekday:"long",

day:"numeric",

month:"long",

year:"numeric"

};



fromClock.innerHTML=

new Intl.DateTimeFormat(

"en-US",

{

...optTime,

timeZone:from

}

).format(now);



toClock.innerHTML=

new Intl.DateTimeFormat(

"en-US",

{

...optTime,

timeZone:to

}

).format(now);

}

).format(now);

new Intl.DateTimeFormat(

}

).format(now);



const fromOffset=

-now.getTimezoneOffset()/60;



difference.innerHTML=

"Live";
