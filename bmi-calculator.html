<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

BMI Calculator | Check Body Mass Index

</title>

<meta
name="description"

content=

"Calculate your BMI instantly using height and weight.">

<meta
name="keywords"

content=

"bmi calculator,body mass index,health">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(

135deg,

#f8fafc,

#e2e8f0,

#dbeafe

);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:700px;

width:100%;

padding:35px;

border-radius:30px;

background:

rgba(
255,
255,
255,
.75
);

backdrop-filter:

blur(20px);

box-shadow:

0 30px 80px

rgba(
0,
0,
0,
.12
);

}

h1{

text-align:center;

margin-bottom:25px;

}

input{

width:100%;

padding:18px;

margin-bottom:18px;

border:none;

border-radius:18px;

font-size:18px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:20px;

color:white;

background:

linear-gradient(

90deg,

#2563eb,

#7c3aed

);

}

.result{

margin-top:25px;

padding:25px;

border-radius:22px;

background:white;

text-align:center;

}

.score{

font-size:50px;

font-weight:900;

}

.tag{

font-size:22px;

margin-top:10px;

}

.bar{

height:14px;

background:#ddd;

border-radius:20px;

overflow:hidden;

margin-top:18px;

}

.fill{

height:100%;

width:0;

transition:.5s;

}

</style>

</head>

<body>

<div class="box">

<h1>

⚖️ BMI Calculator

</h1>

<input

id="height"

type="number"

placeholder="Height (cm)">

<input

id="weight"

type="number"

placeholder="Weight (kg)">

<button

onclick="calc()">

Calculate BMI

</button>

<div id="out">

</div>

</div>

<script>

function calc(){

let h=

height.value/

100;

let w=

weight.value;

if(

!h||

!w

)

return;

let bmi=

(

w/

(
h*h
)

)

.toFixed(

1

);

let txt=

"";

let color=

"";

if(

bmi<18.5

){

txt=

"Underweight";

color=

"#3b82f6";

}

else if(

bmi<25

){

txt=

"Normal";

color=

"#22c55e";

}

else if(

bmi<30

){

txt=

"Overweight";

color=

"#f59e0b";

}

else{

txt=

"Obese";

color=

"#ef4444";

}

out.innerHTML=

`

<div
class='result'>

<div
class='score'>

${bmi}

</div>

<div
class='tag'>

${txt}

</div>

<div
class='bar'>

<div
class='fill'

style='

width:
${bmi*3}%;

background:
${color};

'>

</div>

</div>

</div>

`;

}

</script>

</body>

</html>
