<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Strength Checker | Toolora</title>

<meta name="description" content="Check your password strength instantly. Get security tips and improve your password.">

<meta name="keywords" content="password checker,password strength,strong password,toolora">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}

.container{

width:100%;
max-width:600px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:28px;

padding:35px;

color:white;

box-shadow:0 20px 60px rgba(0,0,0,.4);

}

h1{

text-align:center;
font-size:34px;
margin-bottom:10px;

}

.sub{

text-align:center;
color:#d1d5db;
margin-bottom:25px;

}

.passBox{

display:flex;
gap:10px;

}

.passBox input{

flex:1;

padding:18px;

border:none;

border-radius:16px;

background:#111827;

color:white;

font-size:17px;

outline:none;

}

.passBox button{

width:70px;

border:none;

border-radius:16px;

background:#2563eb;

color:white;

cursor:pointer;

font-size:18px;

}

.bar{

margin-top:25px;

height:12px;

background:#1f2937;

border-radius:30px;

overflow:hidden;

}

.fill{

height:100%;

width:0%;

background:red;

transition:.4s;

}

#status{

margin-top:15px;

text-align:center;

font-size:20px;

font-weight:700;

}

#tips{

margin-top:25px;

background:#111827;

padding:20px;

border-radius:18px;

line-height:1.8;

color:#d1d5db;

}

</style>

</head>

<body>

<div class="container">

<h1>🛡 Password Strength Checker</h1>

<p class="sub">

Check how secure your password is.

</p>

<div class="passBox">

<input
type="password"
id="password"
placeholder="Enter Password">

<button
id="showBtn">

👁

</button>

</div>

<div class="bar">

<div
class="fill"
id="fill">

</div>

</div>

<div id="status">

Waiting...

</div>

<div id="tips">

Tips will appear here...

</div>

<script>

const password = document.getElementById("password");
const fill = document.getElementById("fill");
const status = document.getElementById("status");
const tips = document.getElementById("tips");
const showBtn = document.getElementById("showBtn");

// ===== LIVE CHECK =====

password.addEventListener("input", checkPassword);

function checkPassword(){

let value = password.value;

let score = 0;

let suggestion = [];

// Length
if(value.length >= 8){
score++;
}else{
suggestion.push("• Use at least 8 characters");
}

// Uppercase
if(/[A-Z]/.test(value)){
score++;
}else{
suggestion.push("• Add an uppercase letter (A-Z)");
}

// Lowercase
if(/[a-z]/.test(value)){
score++;
}else{
suggestion.push("• Add a lowercase letter (a-z)");
}

// Number
if(/[0-9]/.test(value)){
score++;
}else{
suggestion.push("• Add a number (0-9)");
}

// Symbol
if(/[^A-Za-z0-9]/.test(value)){
score++;
}else{
suggestion.push("• Add a special symbol (!@#$...)");
}

// ===== STRENGTH =====

if(score<=2){

fill.style.width="30%";
fill.style.background="#ef4444";
status.innerHTML="🔴 Weak";

}

else if(score<=4){

fill.style.width="70%";
fill.style.background="#f59e0b";
status.innerHTML="🟡 Medium";

}

else{

fill.style.width="100%";
fill.style.background="#22c55e";
status.innerHTML="🟢 Strong";

}

// ===== TIPS =====

if(value===""){

tips.innerHTML="Tips will appear here...";

}else if(suggestion.length===0){

tips.innerHTML="✅ Excellent! Your password is strong.";

}else{

tips.innerHTML=suggestion.join("<br>");

}

}

// ===== SHOW / HIDE =====

showBtn.onclick=function(){

if(password.type==="password"){

password.type="text";
showBtn.innerHTML="🙈";

}else{

password.type="password";
showBtn.innerHTML="👁";

}

}

</script>

</div>

</body>
</html>
