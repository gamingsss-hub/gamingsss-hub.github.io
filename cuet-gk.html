<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= GK 25 REAL ================= */
add("GK",[
{
q:"Capital of India?",
o:["Mumbai","Delhi","Kolkata","Chennai"],
c:1
},
{
q:"Who is President of India?",
o:["PM","President","Governor","CM"],
c:1
},
{
q:"National animal of India?",
o:["Lion","Tiger","Elephant","Leopard"],
c:1
},
{
q:"National bird of India?",
o:["Crow","Peacock","Parrot","Eagle"],
c:1
},
{
q:"National flower of India?",
o:["Rose","Lotus","Lily","Sunflower"],
c:1
},
{
q:"Currency of India?",
o:["Dollar","Rupee","Euro","Yen"],
c:1
},
{
q:"National game of India?",
o:["Cricket","Hockey","Football","Kabaddi"],
c:1
},
{
q:"ISRO full form?",
o:["Indian Space Research Organisation","India Space Org","International Space Org","None"],
c:0
},
{
q:"First Prime Minister of India?",
o:["Gandhi","Nehru","Patel","Azad"],
c:1
},
{
q:"Largest state of India by area?",
o:["UP","MP","Rajasthan","Bihar"],
c:2
},

{
q:"Which river is longest in India?",
o:["Yamuna","Ganga","Brahmaputra","Godavari"],
c:1
},
{
q:"UNO established in?",
o:["1919","1945","1950","1935"],
c:1
},
{
q:"Indian independence year?",
o:["1945","1947","1950","1930"],
c:1
},
{
q:"Who wrote Indian Constitution?",
o:["Gandhi","Ambedkar","Nehru","Patel"],
c:1
},
{
q:"National anthem writer?",
o:["Bankim Chandra","Rabindranath Tagore","Premchand","Nehru"],
c:1
},

{
q:"Which is largest ocean?",
o:["Atlantic","Pacific","Indian","Arctic"],
c:1
},
{
q:"Largest continent?",
o:["Africa","Asia","Europe","Australia"],
c:1
},
{
q:"Which gas do humans breathe?",
o:["Carbon dioxide","Oxygen","Nitrogen","Hydrogen"],
c:1
},
{
q:"Boiling point of water?",
o:["90°C","100°C","80°C","120°C"],
c:1
},
{
q:"Planet known as Red Planet?",
o:["Earth","Mars","Venus","Jupiter"],
c:1
},

{
q:"Which planet is closest to Sun?",
o:["Earth","Mercury","Venus","Mars"],
c:1
},
{
q:"How many states in India?",
o:["28","29","30","31"],
c:0
},
{
q:"National sports of India?",
o:["Cricket","Hockey","Football","Kabaddi"],
c:1
},
{
q:"Which is biggest desert in India?",
o:["Thar","Sahara","Gobi","Kalahari"],
c:0
},
{
q:"Who is known as Iron Man of India?",
o:["Nehru","Patel","Gandhi","Bose"],
c:1
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
