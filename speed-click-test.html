<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Click Speed Test – Fast Click Challenge

</title>

<meta
name="description"

content=

"Play Click Speed Test online and see how fast you can click in 10 seconds.">

<meta
name="keywords"

content=

"click speed test,cps test,click game,fast click,online game">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

radial-gradient(

circle,

#1a0033,

#050814,

#000

);

color:white;

overflow:hidden;

}

.box{

width:90%;

max-width:550px;

padding:30px;

text-align:center;

border-radius:35px;

background:

rgba(
255,
255,
255,
.06
);

backdrop-filter:

blur(25px);

box-shadow:

0 0 80px

#00e1ff44;

}

h1{

font-size:38px;

margin-bottom:15px;

}

#timer{

font-size:26px;

margin-bottom:15px;

}

#clickBtn{

width:260px;

height:260px;

border-radius:50%;

border:none;

font-size:34px;

color:white;

cursor:pointer;

background:

linear-gradient(

135deg,

#ff0066,

#6a00ff

);

box-shadow:

0 0 80px

#ff0080;

transition:.1s;

}

#clickBtn:active{

transform:scale(.94);

}

.stats{

display:flex;

justify-content:space-around;

margin-top:25px;

font-size:22px;

}

#result{

margin-top:25px;

font-size:28px;

color:#00ffb7;

}

</style>

</head>

<body>

<div class="box">

<h1>

🏁 Click Speed Test

</h1>

<div id="timer">

10

</div>

<button

id="clickBtn">

START

</button>

<div class="stats">

<div>

🔥

<span id="score">

0

</span>

</div>

<div>

🏆

<span id="best">

0

</span>

</div>

</div>

<div id="result">

Ready?

</div>

</div>

<script>

let clicks=0;

let time=10;

let started=false;

let interval;

let best=

localStorage

.getItem(

"bestClick"

)

||

0;

document

.getElementById(

"best"

)

.innerHTML=

best;

function start(){

started=true;

clicks=0;

time=10;

document

.getElementById(

"score"

)

.innerHTML=

0;

document

.getElementById(

"result"

)

.innerHTML=

"GO!!!";

interval=

setInterval(

()=>{

time--;

document

.getElementById(

"timer"

)

.innerHTML=

time;

if(

time<=0

){

clearInterval(

interval

);

started=false;

let cps=

(

clicks/10

)

.toFixed(

1

);

document

.getElementById(

"result"

)

.innerHTML=

`⚡ ${cps} CPS`;

if(

clicks>

best

){

best=clicks;

localStorage

.setItem(

"bestClick",

best

);

document

.getElementById(

"best"

)

.innerHTML=

best;

}

}

},

1000

);

}

document

.getElementById(

"clickBtn"

)

.onclick=

()=>{

if(

!started

){

start();

return;

}

clicks++;

document

.getElementById(

"score"

)

.innerHTML=

clicks;

};

</script>

</body>

</html>
