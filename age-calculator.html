<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Age Calculator | Calculate Exact Age Online</title>

<meta name="description"
content="Calculate your exact age instantly with years, months, days, zodiac sign and next birthday countdown.">

<meta name="keywords"
content="age calculator, calculate age online, birthday calculator, age finder">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:

linear-gradient(
160deg,
#f5f7ff,
#eef2ff,
#e0f2fe
);

}

.app{

max-width:700px;

width:100%;

padding:30px;

border-radius:36px;

background:

rgba(
255,
255,
255,
0.72
);

backdrop-filter:
blur(20px);

box-shadow:

0 30px 80px
rgba(
0,
0,
0,
0.12
);

}

.logo{

font-size:42px;

text-align:center;

margin-bottom:10px;

}

.title{

font-size:34px;

font-weight:800;

text-align:center;

color:#111827;

}

.sub{

text-align:center;

color:#6b7280;

margin-bottom:30px;

}

input{

width:100%;

padding:20px;

border:none;

border-radius:22px;

font-size:18px;

background:white;

margin-bottom:18px;

box-shadow:

0 8px 25px
rgba(
0,
0,
0,
0.06
);

}

button{

width:100%;

padding:18px;

border:none;

border-radius:20px;

font-size:20px;

font-weight:700;

cursor:pointer;

color:white;

background:

linear-gradient(
90deg,
#2563eb,
#7c3aed
);

}

.cards{

display:grid;

grid-template-columns:

repeat(
2,
1fr
);

gap:16px;

margin-top:28px;

}

.card{

padding:22px;

border-radius:24px;

background:white;

}

.num{

font-size:34px;

font-weight:900;

color:#111827;

}

.label{

color:#64748b;

}

.big{

margin-top:16px;

padding:24px;

border-radius:24px;

background:

linear-gradient(
90deg,
#111827,
#1e293b
);

color:white;

}

@media(max-width:600px){

.cards{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="app">

<div class="logo">
🎂
</div>

<div class="title">
Age Calculator
</div>

<div class="sub">
Years • Months • Days • Zodiac
</div>

<input
type="date"
id="dob">

<button onclick="calc()">

Calculate Age

</button>

<div id="result">

</div>

</div>

<script>

function zodiac(d,m){

if(
(m==1&&d>=20)||(m==2&&d<=18)
)
return"Aquarius";

if(
(m==2&&d>=19)||(m==3&&d<=20)
)
return"Pisces";

if(
(m==3&&d>=21)||(m==4&&d<=19)
)
return"Aries";

if(
(m==4&&d>=20)||(m==5&&d<=20)
)
return"Taurus";

if(
(m==5&&d>=21)||(m==6&&d<=20)
)
return"Gemini";

if(
(m==6&&d>=21)||(m==7&&d<=22)
)
return"Cancer";

if(
(m==7&&d>=23)||(m==8&&d<=22)
)
return"Leo";

if(
(m==8&&d>=23)||(m==9&&d<=22)
)
return"Virgo";

if(
(m==9&&d>=23)||(m==10&&d<=22)
)
return"Libra";

if(
(m==10&&d>=23)||(m==11&&d<=21)
)
return"Scorpio";

if(
(m==11&&d>=22)||(m==12&&d<=21)
)
return"Sagittarius";

return"Capricorn";

}

function calc(){

let v=

dob.value;

if(!v){

alert(
"Select birth date"
);

return;

}

let birth=

new Date(
v
);

let now=

new Date();

let years=

now.getFullYear()

-

birth.getFullYear();

let months=

now.getMonth()

-

birth.getMonth();

let days=

now.getDate()

-

birth.getDate();

if(days<0){

months--;

days+=30;

}

if(months<0){

years--;

months+=12;

}

let next=

new Date(

now.getFullYear(),

birth.getMonth(),

birth.getDate()

);

if(next<now){

next.setFullYear(

next.getFullYear()+1

);

}

let remain=

Math.ceil(

(next-now)

/

86400000

);

result.innerHTML=

`

<div
class="cards">

<div
class="card">

<div
class="num">

${years}

</div>

<div
class="label">

Years

</div>

</div>

<div
class="card">

<div
class="num">

${months}

</div>

<div
class="label">

Months

</div>

</div>

<div
class="card">

<div
class="num">

${days}

</div>

<div
class="label">

Days

</div>

</div>

<div
class="card">

<div
class="num">

${zodiac(

birth.getDate(),

birth.getMonth()+1

)}

</div>

<div
class="label">

Zodiac

</div>

</div>

</div>

<div
class="big">

🎉 Next Birthday

<br><br>

${remain}

 days left

</div>

`;

}

</script>

</body>

</html>
