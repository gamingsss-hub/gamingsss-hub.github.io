<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Random Number Generator | Toolora

</title>

<meta
name="description"
content="Generate random numbers instantly with Toolora">

<meta
name="keywords"
content="random number generator, toolora">

<link
rel="icon"
href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:

linear-gradient(
145deg,
#051421,
#081f39
);

color:white;

padding:24px;

}

.box{

max-width:620px;

margin:auto;

padding:34px;

border-radius:34px;

background:#0d1730;

}

input{

width:100%;

padding:18px;

margin-top:14px;

border:none;

border-radius:18px;

background:#13213f;

color:white;

}

button{

width:100%;

padding:18px;

margin-top:18px;

border:none;

border-radius:20px;

background:

linear-gradient(
45deg,
#00d2ff,
#3a47ff
);

color:white;

}

.result{

margin-top:28px;

font-size:58px;

font-weight:900;

text-align:center;

color:#64e6ff;

}

</style>

</head>

<body>

<div class="box">

<h1>

🎲 Random Generator

</h1>

<input
id="min"
placeholder="Minimum">

<input
id="max"
placeholder="Maximum">

<button onclick="gen()">

Generate

</button>

<div
class="result"
id="result">

0

</div>

</div>

<script>

function gen(){

let min=

Number(

document.getElementById(

"min"

).value

);

let max=

Number(

document.getElementById(

"max"

).value

);

let r=

Math.floor(

Math.random()

*

(

max-min+1

)

)+min;

result.innerHTML=r;

}

</script>

</body>

</html>
