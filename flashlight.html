<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Flashlight – Toolora | Screen Torch

</title>

<meta
name="description"
content="Toolora Flashlight. Turn your screen into a bright flashlight instantly.">

<meta
name="keywords"
content="flashlight, torch, screen flashlight, utility tool, toolora">

<link
rel="icon"
href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#050b18;

color:white;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

transition:.3s;

}

.box{

text-align:center;

}

.back{

position:absolute;

top:24px;

left:24px;

color:white;

text-decoration:none;

}

.title{

font-size:42px;

font-weight:900;

margin-bottom:24px;

}

.circle{

width:180px;

height:180px;

border-radius:50%;

background:

linear-gradient(
45deg,
#6d42ff,
#009dff
);

display:flex;

justify-content:center;

align-items:center;

margin:auto;

font-size:80px;

cursor:pointer;

}

.status{

margin-top:22px;

font-size:22px;

color:#94a3b8;

}

.on{

background:white!important;

color:black!important;

}

</style>

</head>

<body>

<a
href="utility.html"
class="back">

← Utility

</a>



<div class="box">

<div class="title">

🔦 Flashlight

</div>



<div
class="circle"
onclick="toggleFlash()">

💡

</div>



<div
class="status"
id="status">

OFF

</div>

</div>



<script>

let active=false;

function toggleFlash(){

active=!active;

document.body.classList.toggle(

"on"

);

document.getElementById(

"status"

).innerHTML=

active?

"ON"

:

"OFF";

}

</script>

</body>

</html>
