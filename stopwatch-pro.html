<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Stopwatch Pro | Online Stopwatch

</title>

<meta
name="description"

content=

"Use Stopwatch Pro online with lap timer and milliseconds.">

<meta
name="keywords"

content=

"stopwatch,timer,online stopwatch">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(

135deg,

#f5f7ff,

#e0e7ff,

#dbeafe

);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:700px;

width:100%;

padding:35px;

border-radius:35px;

background:

rgba(
255,
255,
255,
.82
);

backdrop-filter:

blur(20px);

text-align:center;

}

.title{

font-size:40px;

font-weight:900;

}

.time{

font-size:70px;

margin:40px 0;

font-weight:900;

}

.btns{

display:flex;

gap:12px;

}

button{

flex:1;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

color:white;

cursor:pointer;

}

.start{

background:#22c55e;

}

.pause{

background:#f59e0b;

}

.reset{

background:#ef4444;

}

.lap{

background:#2563eb;

}

.list{

margin-top:25px;

max-height:250px;

overflow:auto;

}

.item{

padding:14px;

margin-bottom:10px;

border-radius:16px;

background:white;

}

</style>

</head>

<body>

<div class="box">

<div class="title">

⏱️ Stopwatch Pro

</div>

<div
class="time"

id="time">

00:00:00:000

</div>

<div class="btns">

<button
class="start"

onclick="start()">

Start

</button>

<button
class="pause"

onclick="pauseT()">

Pause

</button>

<button
class="lap"

onclick="lap()">

Lap

</button>

<button
class="reset"

onclick="resetT()">

Reset

</button>

</div>

<div
class="list"

id="laps">

</div>

</div>

<script>

let timer;

let ms=0;

function render(){

let h=

String(

Math.floor(
ms/3600000
)

)

.padStart(

2,

0

);

let m=

String(

Math.floor(
(
ms%3600000
)
/60000
)

)

.padStart(

2,

0

);

let s=

String(

Math.floor(
(
ms%60000
)
/1000
)

)

.padStart(

2,

0

);

let mm=

String(

ms%1000

)

.padStart(

3,

0

);

time.innerHTML=

`${h}:${m}:${s}:${mm}`;

}

function start(){

clearInterval(

timer

);

timer=

setInterval(

()=>{

ms+=10;

render();

},

10

);

}

function pauseT(){

clearInterval(

timer

);

}

function resetT(){

clearInterval(

timer

);

ms=0;

laps.innerHTML="";

render();

}

function lap(){

if(

ms===0

)

return;

laps.innerHTML=

`

<div
class='item'>

🏁
${time.innerHTML}

</div>

`

+

laps.innerHTML;

}

render();

</script>

</body>

</html>
