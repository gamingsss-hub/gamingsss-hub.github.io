<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free AI Essay Writer Online | Toolora AI</title>

<meta name="description" content="Generate professional, school, college and academic essays instantly using Toolora AI Essay Writer.">

<meta name="keywords" content="AI Essay Writer, Essay Generator, Free Essay Writer, AI Writing Tool, Toolora AI">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="essay-writer.css">

</head>

<body>

<div class="bg"></div>

<div class="container">

<header>

<h1>📝 Toolora AI Essay Writer</h1>

<p>Create professional essays in seconds with AI.</p>

</header>

<div class="main">

<!-- LEFT PANEL -->

<div class="left-panel">

<label>Essay Topic</label>

<input
type="text"
id="topic"
placeholder="Enter essay topic...">

<label>Essay Type</label>

<select id="type">

<option>School</option>
<option>College</option>
<option>Academic</option>
<option>Professional</option>
<option>Creative</option>

</select>

<label>Language</label>

<select id="language">

<option>English</option>
<option>Hindi</option>

</select>

<label>Word Count</label>

<select id="words">

<option>100</option>
<option>300</option>
<option>500</option>
<option>1000</option>

</select>

<button id="generate">
🚀 Generate Essay
</button>

</div>

<!-- RIGHT PANEL -->

<div class="right-panel">

<div class="toolbar">

<button id="copy">
📋 Copy
</button>

<button id="download">
📥 Download
</button>

<button id="regenerate">
🔄 Regenerate
</button>

</div>

<div id="output">

Your AI generated essay will appear here...

</div>

</div>

</div>

</div>

<script src="essay-writer.js"></script>

</body>
</html>
