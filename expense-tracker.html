<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Expense Tracker | Track Money
</title>

<meta
name="description"
content="Track expenses and manage money online">

<meta
name="keywords"
content="expense tracker,money tracker,budget">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:

linear-gradient(
135deg,
#f8fafc,
#dbeafe,
#eef2ff
);

padding:20px;

display:flex;

justify-content:center;

}

.box{

width:100%;

max-width:500px;

background:white;

padding:25px;

border-radius:28px;

box-shadow:

0 20px 60px
rgba(0,0,0,.12);

}

h1{

text-align:center;

margin-bottom:20px;

}

input,select{

width:100%;

padding:16px;

margin-bottom:12px;

border:none;

background:#f3f4f6;

border-radius:14px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:

linear-gradient(
90deg,
#2563eb,
#7c3aed
);

color:white;

font-size:18px;

}

.total{

margin:25px 0;

font-size:34px;

font-weight:900;

text-align:center;

}

.item{

padding:15px;

background:#f8fafc;

margin-bottom:10px;

border-radius:16px;

display:flex;

justify-content:space-between;

}

.del{

background:red;

color:white;

padding:8px 12px;

border-radius:10px;

}

</style>

</head>

<body>

<div class="box">

<h1>
💸 Expense Tracker
</h1>

<input
id="name"
placeholder="Expense">

<input
id="amount"
type="number"
placeholder="Amount">

<select id="cat">

<option>Food</option>

<option>Travel</option>

<option>Shopping</option>

<option>Other</option>

</select>

<button onclick="add()">

Add Expense

</button>

<div
class="total"

id="total">

₹0

</div>

<div
id="list">

</div>

</div>

<script>

const nameInput =
document.getElementById("name");

const amountInput =
document.getElementById("amount");

const catInput =
document.getElementById("cat");

const total =
document.getElementById("total");

const list =
document.getElementById("list");

let data =
JSON.parse(
localStorage.getItem(
"money"
)
)||[];

function save(){

localStorage.setItem(

"money",

JSON.stringify(
data
)

);

}

function add(){

if(

nameInput.value.trim()===""||

amountInput.value===""

){

alert(

"Fill all fields"

);

return;

}

data.push({

n:

nameInput.value,

a:

Number(
amountInput.value
),

c:

catInput.value

});

save();

render();

nameInput.value="";

amountInput.value="";

}

function del(i){

data.splice(i,1);

save();

render();

}

function render(){

list.innerHTML="";

let sum=0;

data.forEach(

(item,index)=>{

sum+=item.a;

list.innerHTML+=`

<div class="item">

<div>

<b>

${item.n}

</b>

<br>

${item.c}

</div>

<div>

₹${item.a}

<br><br>

<button
class="del"

onclick="del(${index})">

Delete

</button>

</div>

</div>

`;

});

total.innerHTML=

"₹"+sum;

}

render();

</script>
</body>

</html>
