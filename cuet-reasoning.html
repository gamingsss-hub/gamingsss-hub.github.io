<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= REASONING 25 REAL ================= */
add("REASONING",[
{
q:"Series: 2, 4, 8, 16, ?",
o:["18","20","32","24"],
c:2
},
{
q:"Series: 3, 6, 12, 24, ?",
o:["30","36","48","42"],
c:2
},
{
q:"Odd one out?",
o:["Apple","Banana","Carrot","Mango"],
c:2
},
{
q:"A is taller than B. B is taller than C. Who is shortest?",
o:["A","B","C","Cannot say"],
c:2
},
{
q:"Coding: DOG = EPH, CAT = ?",
o:["DBU","CBU","CAU","DAU"],
c:0
},
{
q:"25% of 200 = ?",
o:["25","50","75","100"],
c:1
},
{
q:"If 5 men complete work in 10 days, 10 men take?",
o:["5","10","15","20"],
c:0
},
{
q:"Clock angle at 3:00?",
o:["90°","60°","120°","180°"],
c:0
},
{
q:"Direction: East → Right turn = ?",
o:["North","South","West","East"],
c:2
},
{
q:"Mirror of 12:00?",
o:["12:00","11:00","1:00","10:00"],
c:0
},

{
q:"Series: 1, 4, 9, 16, ?",
o:["20","25","30","36"],
c:1
},
{
q:"If A=1, B=2, then Z=?",
o:["24","25","26","27"],
c:2
},
{
q:"Find odd one: 2, 4, 6, 9",
o:["2","4","6","9"],
c:3
},
{
q:"Blood relation: Father of my father is my?",
o:["Brother","Grandfather","Uncle","Cousin"],
c:1
},
{
q:"If all cats are animals, all animals are living, cats are?",
o:["Living","Dead","Non-living","None"],
c:0
},

{
q:"Series: 5, 10, 20, 40, ?",
o:["60","80","100","70"],
c:1
},
{
q:"Analogy: Book : Read :: Food : ?",
o:["Eat","Cook","Make","Sell"],
c:0
},
{
q:"Simple interest on 1000 at 10% for 2 years?",
o:["100","150","200","250"],
c:2
},
{
q:"If A is north of B, B is north of C, A is?",
o:["South of C","North of C","East of C","West of C"],
c:1
},
{
q:"Cube root of 27?",
o:["2","3","4","5"],
c:1
},

{
q:"Series: 10, 20, 30, 40, ?",
o:["45","50","60","55"],
c:1
},
{
q:"If 2+2=5 then 3+3=?",
o:["6","7","8","9"],
c:3
},
{
q:"Water is to liquid as ice is to?",
o:["Gas","Solid","Steam","Air"],
c:1
},
{
q:"Odd one: Circle, Square, Triangle, Potato",
o:["Circle","Square","Triangle","Potato"],
c:3
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>
