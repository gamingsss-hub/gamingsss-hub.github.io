<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Escape Room – Solve Puzzles & Escape Online

</title>

<meta
name="description"

content=

"Play Escape Room online and solve puzzles to unlock every room and escape.">

<meta
name="keywords"

content=

"escape room,puzzle game,riddle game,brain game,mystery game">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(

135deg,

#050816,

#0a1733,

#000

);

color:white;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:600px;

width:100%;

padding:35px;

text-align:center;

border-radius:30px;

background:

rgba(
255,
255,
255,
.05
);

backdrop-filter:

blur(20px);

box-shadow:

0 0 80px

#00ccff44;

}

h1{

margin-bottom:20px;

}

#room{

font-size:28px;

margin-bottom:20px;

}

#question{

font-size:24px;

margin-bottom:25px;

}

input{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:20px;

margin-bottom:20px;

}

button{

padding:16px 35px;

border:none;

border-radius:16px;

font-size:20px;

background:

linear-gradient(

90deg,

#00aaff,

#0055ff

);

color:white;

}

#msg{

margin-top:20px;

font-size:24px;

}

</style>

</head>

<body>

<div class="box">

<h1>

🚪 Escape Room

</h1>

<div id="room">

Room 1

</div>

<div id="question">

Loading...

</div>

<input
id="ans"

placeholder=

"Type answer">

<button

onclick=

"check()">

Unlock

</button>

<div id="msg">

</div>

</div>

<script>

const rooms=[

{

q:

"2 + 2 ?",

a:

"4"

},

{

q:

"Color of sky",

a:

"blue"

},

{

q:

"First month",

a:

"january"

},

{

q:

"5 × 5",

a:

"25"

},

{

q:

"What opens lock?",

a:

"key"

}

];

let level=0;

function load(){

document

.getElementById(

"room"

)

.innerHTML=

`Room ${level+1}`;

document

.getElementById(

"question"

)

.innerHTML=

rooms[level].q;

document

.getElementById(

"ans"

)

.value="";

}

function check(){

let v=

document

.getElementById(

"ans"

)

.value

.toLowerCase()

.trim();

if(

v===

rooms[level].a

){

level++;

if(

level===5

){

document.body.innerHTML=

`

<div
style='

display:flex;

justify-content:center;

align-items:center;

height:100vh;

background:black;

color:white;

font-size:40px;

'>

🏆 YOU ESCAPED

</div>

`;

return;

}

load();

document

.getElementById(

"msg"

)

.innerHTML=

"🔓 Opened";

}

else{

document

.getElementById(

"msg"

)

.innerHTML=

"❌ Wrong";

}

}

load();

</script>

</body>

</html>
