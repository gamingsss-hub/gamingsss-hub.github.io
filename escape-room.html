<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Escape Room – Solve Puzzles & Escape Online

</title>

<meta
name="description"

content=

"Play Escape Room online and solve puzzles to unlock every room and escape.">

<meta
name="keywords"

content=

"escape room,puzzle game,riddle game,brain game,mystery game">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(

135deg,

#050816,

#0a1733,

#000

);

color:white;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:600px;

width:100%;

padding:35px;

text-align:center;

border-radius:30px;

background:

rgba(
255,
255,
255,
.05
);

backdrop-filter:

blur(20px);

box-shadow:

0 0 80px

#00ccff44;

}

h1{

margin-bottom:20px;

}

#room{

font-size:28px;

margin-bottom:20px;

}

#question{

font-size:24px;

margin-bottom:25px;

}

input{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:20px;

margin-bottom:20px;

}

button{

padding:16px 35px;

border:none;

border-radius:16px;

font-size:20px;

background:

linear-gradient(

90deg,

#00aaff,

#0055ff

);

color:white;

}

#msg{

margin-top:20px;

font-size:24px;

}

</style>

</head>

<body>

<div class="box">

<h1>

🚪 Escape Room

</h1>

<div id="room">

Room 1

</div>

<div id="question">

Loading...

</div>

<input
id="ans"

placeholder=

"Type answer">

<button

onclick=

"check()">

Unlock

</button>

<div id="msg">

</div>

</div>

<script>

const levels={

easy:[
{q:"2 + 2 ?",a:"4"},
{q:"Color of sky",a:"blue"},
{q:"First month",a:"january"},
{q:"5 × 5",a:"25"},
{q:"What opens lock?",a:"key"}
],

medium:[
{q:"I speak without mouth. What am I?",a:"echo"},
{q:"What has keys but no locks?",a:"keyboard"},
{q:"What comes once in a minute twice in a moment?",a:"m"},
{q:"7×8+2",a:"58"},
{q:"Capital of Australia",a:"canberra"}
],

hard:[
{q:"I am always coming but never arrive?",a:"tomorrow"},
{q:"What has one eye but cannot see?",a:"needle"},
{q:"What gets wetter while drying?",a:"towel"},
{q:"What belongs to you but others use more?",a:"name"},
{q:"Decode: 1 1 2 3 5 8 ?",a:"13"}
]

};

let mode="easy";
let room=0;

document.querySelector(".box").insertAdjacentHTML(
"afterbegin",

`

<select id="mode"

style="

padding:12px;

margin-bottom:20px;

border-radius:12px;

font-size:18px;

">

<option value="easy">

🟢 Easy

</option>

<option value="medium">

🟡 Medium

</option>

<option value="hard">

🔴 Hard

</option>

</select>

`

);

document

.getElementById("mode")

.onchange=(e)=>{

mode=e.target.value;

room=0;

load();

};

function load(){

document

.getElementById("room")

.innerHTML=

`${mode.toUpperCase()} • Room ${room+1}/5`;

document

.getElementById("question")

.innerHTML=

levels[mode][room].q;

document

.getElementById("ans").value="";

document

.getElementById("msg").innerHTML="";

}

function check(){

let input=

document

.getElementById("ans")

.value

.toLowerCase()

.trim();

if(

input===

levels[mode][room].a

){

room++;

document

.getElementById("msg")

.innerHTML=

"🔓 Correct";

if(room===5){

if(mode==="easy"){

alert(

"🟢 Easy Completed → Medium Unlock"

);

mode="medium";

}

else if(

mode==="medium"

){

alert(

"🟡 Medium Completed → Hard Unlock"

);

mode="hard";

}

else{

document.body.innerHTML=

`

<div

style='

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:black;

color:white;

font-size:45px;

text-align:center;

'

>

🏆 FINAL ESCAPE<br>

You Escaped All Rooms

</div>

`;

return;

}

document

.getElementById("mode")

.value=mode;

room=0;

}

load();

}

else{

document

.getElementById("msg")

.innerHTML=

"❌ Wrong Answer";

}

}

document

.getElementById("ans")

.addEventListener(

"keypress",

(e)=>{

if(

e.key==="Enter"

)

check();

}

);

load();

</script>

</body>

</html>
