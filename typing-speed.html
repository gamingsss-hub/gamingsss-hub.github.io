<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Typing Arena X | QuizEmpire
</title>

<meta
name="description"
content="Type long paragraphs and test real typing speed.">

<meta
name="keywords"
content="typing speed,wpm test,typing game">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050816,
#111827
);

color:white;

padding:20px;

}

.wrap{

max-width:1000px;

margin:auto;

}

.title{

font-size:55px;

text-align:center;

color:#67e8f9;

}

.box{

margin-top:30px;

padding:35px;

border-radius:25px;

background:#111827;

}

.progress{

height:12px;

background:#222;

border-radius:99px;

overflow:hidden;

}

.fill{

width:0;

height:100%;

background:#22d3ee;

}

.text{

margin-top:20px;

font-size:24px;

line-height:2;

color:#d1d5db;

}

.input{

margin-top:25px;

width:100%;

height:220px;

padding:25px;

font-size:22px;

border:none;

background:#172554;

color:white;

border-radius:20px;

}

.stats{

display:flex;

gap:20px;

justify-content:center;

margin-top:25px;

flex-wrap:wrap;

}

.card{

width:200px;

padding:25px;

background:#172554;

border-radius:20px;

text-align:center;

}

.big{

font-size:40px;

color:#22d3ee;

}

</style>

</head>

<body>

<div class="wrap">

<div class="title">

⌨️ Typing Arena X

</div>

<div class="box">

<div class="progress">

<div
class="fill"
id="fill">

</div>

</div>

<div
class="text"
id="sample">

</div>

<textarea

class="input"

id="input"

placeholder="Type...">

</textarea>

<div class="stats">

<div class="card">

⚡

<div
class="big"
id="wpm">

0

</div>

WPM

</div>

<div class="card">

🎯

<div
class="big"
id="acc">

100

</div>

Accuracy

</div>

<div class="card">

⏱

<div
class="big"
id="time">

0

</div>

Sec

</div>

</div>

</div>

</div>

<script>

let para=[

`Discipline is the bridge between goals and achievements. Every day that you practice and improve creates a stronger version of yourself in the future.`,

`Typing at high speed requires controlled movement precision rhythm and complete focus under pressure.`,

`The strongest people are not always the most talented but the ones who continue after everyone else stops.`

];

let current=0;

let totalWords=0;

let startTime=null;

sample.innerHTML=

para[current];

input.addEventListener(

"input",

()=>{

if(!startTime)

startTime=

Date.now();

run();

});

function run(){

let target=

para[current]

.trim();

let typed=

input.value

.trim();

let elapsed=

(

Date.now()

-

startTime

)

/

1000;

time.innerHTML=

elapsed.toFixed(1);

let progress=

typed.length/

target.length

*100;

fill.style.width=

Math.min(

progress,

100

)

+"%";

let words=

typed

.split(/\s+/)

.filter(Boolean)

.length;

wpm.innerHTML=

Math.floor(

words/

Math.max(

elapsed,

1

)

*60

);

let correct=0;

for(

let i=0;

i<typed.length;

i++

){

if(

typed[i]

===

target[i]

)

correct++;

}

let accuracy=

Math.floor(

correct/

Math.max(

typed.length,

1

)

*100

);

acc.innerHTML=

accuracy||0;


if(

typed===target

){

totalWords+=

target

.split(" ")

.length;

current++;

input.value="";

fill.style.width="0%";


if(

current<para.length

){

sample.innerHTML=

para[current];

}

else{

finish();

}

}

}

function finish(){

let sec=

(

Date.now()

-

startTime

)

/

1000;

let final=

Math.floor(

totalWords/

sec

*60

);

sample.innerHTML=

"🔥 COMPLETED";

input.style.display=

"none";

alert(

"🏆 RESULT\n\n⚡ WPM: "

+

final+

"\n🎯 Accuracy: "

+

acc.innerHTML+

"%\n⏱ "

+

sec.toFixed(1)

+

" Sec"

);

}

</script>
  
</body>

</html>
