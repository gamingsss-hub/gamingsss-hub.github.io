<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Typing Speed Test | QuizEmpire

</title>

<meta
name="description"
content="Test your typing speed and accuracy online on QuizEmpire.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:

linear-gradient(
135deg,
#030712,
#111827,
#1e1b4b
);

color:white;

padding:20px;

}

.wrap{

max-width:900px;

margin:auto;

}

.title{

text-align:center;

font-size:58px;

color:#67e8f9;

font-weight:900;

}

.box{

margin-top:30px;

padding:35px;

border-radius:25px;

background:

linear-gradient(
145deg,
#172554,
#1e293b
);

}

.text{

font-size:24px;

line-height:2;

color:#e2e8f0;

}

.input{

margin-top:30px;

width:100%;

height:180px;

border:none;

padding:20px;

border-radius:20px;

font-size:20px;

resize:none;

background:#0f172a;

color:white;

}

.stats{

display:flex;

justify-content:center;

gap:20px;

margin-top:30px;

flex-wrap:wrap;

}

.card{

width:180px;

padding:25px;

background:#0f172a;

border-radius:20px;

text-align:center;

}

.btn{

margin-top:30px;

width:100%;

padding:18px;

border:none;

border-radius:18px;

background:#22d3ee;

font-size:20px;

}

</style>

</head>

<body>

<div class="wrap">

<div class="title">

⌨️ Typing Speed

</div>

<div class="box">

<div class="text" id="text">

Practice typing to improve speed and accuracy.

</div>

<textarea
class="input"
id="input"
placeholder="Start typing...">
</textarea>

<button
class="btn"
onclick="finish()">

Finish

</button>

</div>

<div class="stats">

<div class="card">

⏱

<h2 id="time">

60

</h2>

Sec

</div>

<div class="card">

⚡

<h2 id="wpm">

0

</h2>

WPM

</div>

<div class="card">

🎯

<h2 id="acc">

100

</h2>

%

</div>

</div>

</div>

<script>

let time=60;

let timer=

setInterval(()=>{

time--;

document

.getElementById(

"time"

)

.innerHTML=

time;

if(time<=0){

finish();

}

},1000);


function finish(){

clearInterval(timer);

let typed=

document

.getElementById(

"input"

)

.value;

let words=

typed

.trim()

.split(" ")

.length;

let wpm=

words;

document

.getElementById(

"wpm"

)

.innerHTML=

wpm;

let accuracy=

Math.max(

60,

100-

Math.floor(

typed.length/10

)

);

document

.getElementById(

"acc"

)

.innerHTML=

accuracy;

localStorage.typing=

wpm;

alert(

"Your Speed: "+wpm+" WPM"

);

}

</script>

</body>

</html>
