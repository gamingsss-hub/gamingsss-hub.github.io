<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Typing Arena Pro | QuizEmpire
</title>

<meta
name="description"
content="Complete paragraphs fast and improve typing speed.">

<meta
name="keywords"
content="typing speed,wpm,typing game,keyboard challenge">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050816,
#111827,
#0f172a
);

color:white;

padding:20px;

}

.wrap{

max-width:1000px;

margin:auto;

}

.title{

font-size:58px;

text-align:center;

color:#67e8f9;

}

.box{

margin-top:30px;

padding:35px;

background:#111827;

border-radius:25px;

}

.progress{

height:10px;

background:#222;

border-radius:99px;

overflow:hidden;

}

.fill{

height:100%;

width:0;

background:#22d3ee;

}

.text{

margin-top:20px;

font-size:24px;

line-height:2;

}

.input{

margin-top:25px;

width:100%;

height:180px;

border:none;

padding:25px;

font-size:22px;

border-radius:20px;

background:#172554;

color:white;

}

.stats{

display:flex;

gap:20px;

margin-top:25px;

justify-content:center;

flex-wrap:wrap;

}

.card{

width:180px;

padding:20px;

background:#172554;

border-radius:20px;

text-align:center;

}

.big{

font-size:40px;

color:#67e8f9;

}

.btn{

width:100%;

margin-top:25px;

padding:18px;

border:none;

border-radius:20px;

font-size:20px;

background:#22d3ee;

display:none;

}

</style>

</head>

<body>

<div class="wrap">

<div class="title">

⌨️ Typing Arena Pro

</div>

<div class="box">

<div class="progress">

<div
class="fill"
id="fill">

</div>

</div>

<div
class="text"
id="sample">

Success comes from daily effort and continuous improvement.

</div>

<textarea

class="input"

id="input"

placeholder="Type here...">

</textarea>

<button
class="btn"
id="next"
onclick="next()">

NEXT →

</button>

<div class="stats">

<div class="card">

⏱

<div
class="big"
id="time">

60

</div>

</div>

<div class="card">

⚡

<div
class="big"
id="wpm">

0

</div>

</div>

<div class="card">

🎯

<div
class="big"
id="acc">

100

</div>

</div>

</div>

</div>

</div>

<script>

let list=[

"Success comes from daily effort and continuous improvement.",

"Typing quickly requires focus and accuracy together.",

"Small wins every day become massive achievements later."

];

let index=0;

let started=false;

let time=60;

let timer;

const input=

document.getElementById(

"input"

);

input.addEventListener(

"input",

()=>{

if(!started){

started=true;

start();

}

check();

});

function start(){

timer=

setInterval(()=>{

time--;

timeEl.innerHTML=time;

if(time<=0){

end();

}

},1000);

}

let timeEl=

document.getElementById(

"time"

);

function check(){

let text=

sample.innerText;

let typed=

input.value;

let progress=

typed.length/

text.length

*100;

fill.style.width=

progress+"%";

let words=

typed.trim()

.split(/\s+/)

.length;

wpm.innerHTML=

words;

let correct=0;

for(

let i=0;

i<typed.length;

i++

){

if(

typed[i]

===

text[i]

)

correct++;

}

acc.innerHTML=

Math.floor(

correct/

Math.max(

typed.length,

1

)

*100

);

if(

typed===text

){

next.style.display=

"block";

}

}

function next(){

index++;

if(index>=list.length){

end();

return;

}

sample.innerHTML=

list[index];

input.value="";

fill.style.width=0;

next.style.display="none";

}

function end(){

clearInterval(timer);

alert(

"Finished 🔥"

);

input.disabled=true;

}

</script>

</body>

</html>
