<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Typing Arena | QuizEmpire</title>

<meta
name="description"
content="Type paragraphs, improve WPM and accuracy. Premium typing speed challenge on QuizEmpire.">

<meta
name="keywords"
content="typing speed, wpm test, typing arena, keyboard game, typing challenge">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050816,
#111827,
#0f172a
);

color:white;

padding:20px;

}

.wrap{

max-width:1000px;

margin:auto;

}

.title{

font-size:60px;

text-align:center;

color:#67e8f9;

font-weight:900;

}

.text{

margin-top:35px;

padding:35px;

font-size:26px;

line-height:2;

border-radius:25px;

background:#111827;

color:#d1d5db;

}

.input{

margin-top:30px;

width:100%;

height:220px;

border:none;

outline:none;

border-radius:25px;

padding:30px;

font-size:22px;

background:#172554;

color:white;

}

.stats{

display:flex;

gap:20px;

justify-content:center;

margin-top:30px;

flex-wrap:wrap;

}

.box{

width:180px;

padding:22px;

background:#111827;

border-radius:20px;

text-align:center;

}

.big{

font-size:40px;

color:#22d3ee;

}

</style>

</head>

<body>

<div class="wrap">

<div class="title">

⌨️ Typing Arena

</div>

<div
class="text"
id="sample">

Success is the result of consistent effort and focused practice. Every small improvement creates a bigger future.

</div>

<textarea

class="input"

id="input"

placeholder="Start typing...">

</textarea>


<div class="stats">

<div class="box">

⏱

<div
class="big"
id="time">

60

</div>

</div>


<div class="box">

⚡

<div
class="big"
id="wpm">

0

</div>

</div>


<div class="box">

🎯

<div
class="big"
id="acc">

100

</div>

</div>

</div>

</div>

<script>

let time=60;

let started=false;

let timer;

const input=

document
.getElementById(
"input"
);

input.addEventListener(

"input",

()=>{

if(!started){

started=true;

start();

}

update();

});

function start(){

timer=

setInterval(()=>{

time--;

timeEl.innerHTML=time;

if(time<=0){

clearInterval(timer);

input.disabled=true;

alert(

"Finished"

);

}

},1000);

}

let timeEl=

document.getElementById(

"time"

);

function update(){

let typed=

input.value;

let words=

typed.trim()

.split(/\s+/)

.length;

document

.getElementById(

"wpm"

)

.innerHTML=

words;

let sample=

document

.getElementById(

"sample"

)

.innerText;

let correct=0;

for(

let i=0;

i<typed.length;

i++

){

if(

typed[i]

===

sample[i]

)

correct++;

}

let acc=

Math.floor(

(correct/

Math.max(

typed.length,

1

)

)

*100

);

document

.getElementById(

"acc"

)

.innerHTML=

acc;

}

</script>

</body>

</html>
