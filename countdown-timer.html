<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Countdown Timer | Online Timer

</title>

<meta
name="description"

content=

"Set countdown timer online with hours minutes and seconds.">

<meta
name="keywords"

content=

"countdown timer,timer online,stopwatch">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

padding:16px;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#eef2ff,
#dbeafe,
#f8fafc
);

font-family:Arial;

}

.box{

width:100%;

max-width:430px;

padding:24px;

border-radius:30px;

background:

rgba(
255,
255,
255,
0.85
);

backdrop-filter:

blur(20px);

box-shadow:

0 20px 60px
rgba(
0,
0,
0,
0.12
);

}

h1{

font-size:28px;

margin-bottom:22px;

text-align:center;

}

.inputs{

display:grid;

grid-template-columns:

repeat(
3,
1fr
);

gap:10px;

width:100%;

}

.inputs input{

width:100%;

min-width:0;

padding:16px;

border:none;

border-radius:16px;

text-align:center;

font-size:18px;

background:#fff;

}

.timer{

font-size:52px;

font-weight:900;

margin:30px 0;

text-align:center;

word-break:break-word;

}

.btns{

display:grid;

grid-template-columns:

repeat(
3,
1fr
);

gap:10px;

}

button{

padding:15px;

border:none;

border-radius:16px;

font-size:16px;

color:white;

}

.start{

background:#2563eb;

}

.pause{

background:#f59e0b;

}

.reset{

background:#ef4444;

}

@media(max-width:420px){

.timer{

font-size:42px;

}

.inputs{

grid-template-columns:1fr;

}

.btns{

grid-template-columns:1fr;

}

</style>

</head>

<body>

<div class="box">

<h1>

⏳ Countdown Timer

</h1>

<div class="inputs">

<input id="h" placeholder="Hours">

<input id="m" placeholder="Minutes">

<input id="s" placeholder="Seconds">

</div>

<div
class="timer"

id="show">

00:00:00

</div>

<div class="btns">

<button
class="start"

onclick="start()">

Start

</button>

<button
class="pause"

onclick="pauseT()">

Pause

</button>

<button
class="reset"

onclick="resetT()">

Reset

</button>

</div>

<audio
id="done">

<source
src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">

</audio>

</div>

<script>

let t;

let total=0;

function update(){

let hh=

String(

Math.floor(
total/3600
)

)

.padStart(

2,

0

);

let mm=

String(

Math.floor(
(
total%3600
)
/60
)

)

.padStart(

2,

0

);

let ss=

String(

total%60

)

.padStart(

2,

0

);

show.innerHTML=

`${hh}:${mm}:${ss}`;

}

function start(){

if(

!total

){

total=

(+h.value*3600)+

(+m.value*60)+

(+s.value);

}

clearInterval(

t

);

t=

setInterval(

()=>{

if(

total<=0

){

clearInterval(

t

);

done.play();

show.innerHTML=

"⏰ DONE";

return;

}

total--;

update();

},

1000

);

update();

}

function pauseT(){

clearInterval(

t

);

}

function resetT(){

clearInterval(

t

);

total=0;

show.innerHTML=

"00:00:00";

}

</script>

</body>

</html>
