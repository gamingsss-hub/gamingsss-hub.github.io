<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Countdown Timer | Online Timer

</title>

<meta
name="description"

content=

"Set countdown timer online with hours minutes and seconds.">

<meta
name="keywords"

content=

"countdown timer,timer online,stopwatch">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(

135deg,

#f8fafc,

#dbeafe,

#e0e7ff

);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.box{

max-width:700px;

width:100%;

padding:35px;

border-radius:35px;

background:

rgba(
255,
255,
255,
.8
);

backdrop-filter:

blur(20px);

text-align:center;

}

h1{

margin-bottom:30px;

}

.inputs{

display:flex;

gap:10px;

}

input{

flex:1;

padding:18px;

border:none;

border-radius:18px;

font-size:20px;

text-align:center;

}

.timer{

font-size:70px;

margin:40px 0;

font-weight:900;

}

.btns{

display:flex;

gap:10px;

}

button{

flex:1;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

color:white;

}

.start{

background:#2563eb;

}

.pause{

background:#f59e0b;

}

.reset{

background:#ef4444;

}

</style>

</head>

<body>

<div class="box">

<h1>

⏳ Countdown Timer

</h1>

<div class="inputs">

<input
id="h"
placeholder="HH">

<input
id="m"
placeholder="MM">

<input
id="s"
placeholder="SS">

</div>

<div
class="timer"

id="show">

00:00:00

</div>

<div class="btns">

<button
class="start"

onclick="start()">

Start

</button>

<button
class="pause"

onclick="pauseT()">

Pause

</button>

<button
class="reset"

onclick="resetT()">

Reset

</button>

</div>

<audio
id="done">

<source
src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">

</audio>

</div>

<script>

let t;

let total=0;

function update(){

let hh=

String(

Math.floor(
total/3600
)

)

.padStart(

2,

0

);

let mm=

String(

Math.floor(
(
total%3600
)
/60
)

)

.padStart(

2,

0

);

let ss=

String(

total%60

)

.padStart(

2,

0

);

show.innerHTML=

`${hh}:${mm}:${ss}`;

}

function start(){

if(

!total

){

total=

(+h.value*3600)+

(+m.value*60)+

(+s.value);

}

clearInterval(

t

);

t=

setInterval(

()=>{

if(

total<=0

){

clearInterval(

t

);

done.play();

show.innerHTML=

"⏰ DONE";

return;

}

total--;

update();

},

1000

);

update();

}

function pauseT(){

clearInterval(

t

);

}

function resetT(){

clearInterval(

t

);

total=0;

show.innerHTML=

"00:00:00";

}

</script>

</body>

</html>
