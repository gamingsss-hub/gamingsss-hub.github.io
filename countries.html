<!DOCTYPE html><html><head><title>Country Universe | QuizEmpire

</title><meta
name="viewport"
content="width=device-width,initial-scale=1">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins;

}

body{

background:

linear-gradient(
135deg,
#020617,
#0f172a,
#172554,
#3b0764
);

min-height:100vh;

padding:25px;

color:white;

}

.logo{

text-align:center;

font-size:70px;

font-weight:900;

background:

linear-gradient(
90deg,
#00e6ff,
#67e8f9,
#ff4dff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.sub{

text-align:center;

color:#cbd5e1;

margin-top:15px;

}

.search{

width:100%;

max-width:900px;

display:block;

margin:auto;

margin-top:40px;

padding:22px;

border:none;

border-radius:999px;

background:

rgba(255,255,255,.06);

color:white;

font-size:18px;

}

.cards{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(230px,1fr)
);

gap:30px;

margin-top:60px;

}

.card{

background:

rgba(255,255,255,.04);

backdrop-filter:

blur(30px);

padding:40px;

border-radius:35px;

text-align:center;

text-decoration:none;

color:white;

transition:.4s;

border:

1px solid
rgba(255,255,255,.08);

}

.card:hover{

transform:

translateY(-15px)
scale(1.03);

box-shadow:

0 0 60px
#00e6ff55;

}

.flag{

font-size:70px;

}

.name{

font-size:34px;

font-weight:900;

margin-top:10px;

}

.badge{

margin-top:15px;

display:inline-block;

padding:10px 20px;

border-radius:999px;

background:

linear-gradient(
90deg,
#00e6ff,
#8b5cf6
);

color:black;

font-weight:900;

}

.footer{

margin-top:70px;

text-align:center;

color:#94a3b8;

}

</style></head><body><div class="logo">🌍 COUNTRYVERSE

</div><div class="sub">Travel The World Through Quizzes

</div><input

class="search"

placeholder="🔍 Search Country">

<div class="cards"><a href="india.html" class="card"><div class="flag">🇮🇳

</div><div class="name">India

</div><div class="badge">PLAY

</div></a><a href="usa.html" class="card"><div class="flag">🇺🇸

</div><div class="name">USA

</div><div class="badge">PLAY

</div></a><a href="japan.html" class="card"><div class="flag">🇯🇵

</div><div class="name">Japan

</div><div class="badge">PLAY

</div></a><a href="france.html" class="card"><div class="flag">🇫🇷

</div><div class="name">France

</div><div class="badge">PLAY

</div></a><a href="germany.html" class="card"><div class="flag">🇩🇪

</div><div class="name">Germany

</div><div class="badge">PLAY

</div></a><a href="brazil.html" class="card"><div class="flag">🇧🇷

</div><div class="name">Brazil

</div><div class="badge">PLAY

</div></a></div><div class="footer">© QuizEmpire

</div></body></html>
