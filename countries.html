<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

background:

linear-gradient(
135deg,
#140021,
#26003d,
#45006e,
#090010
);

color:white;

overflow-x:hidden;

min-height:100vh;

}

.container{

width:90%;

max-width:1500px;

margin:auto;

padding:40px 0;

}

.logo{

font-size:90px;

font-weight:900;

text-align:center;

background:

linear-gradient(
90deg,
#ff44ee,
#7c5cff,
#00f2ff
);

-webkit-background-clip:text;

color:transparent;

}

.sub{

text-align:center;

margin-top:10px;

font-size:18px;

color:#ddd;

}

.search{

width:100%;

max-width:900px;

display:block;

margin:40px auto;

padding:22px;

border:none;

outline:none;

border-radius:60px;

background:

rgba(255,255,255,.08);

backdrop-filter:

blur(20px);

color:white;

font-size:18px;

}

.cards{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(300px,1fr)
);

gap:30px;

}

.card{

background:

rgba(255,255,255,.06);

backdrop-filter:

blur(18px);

padding:45px;

border-radius:35px;

text-align:center;

border:

1px solid

rgba(255,255,255,.15);

transition:.5s;

}

.card:hover{

transform:

translateY(-12px);

box-shadow:

0 0 70px

rgba(255,0,255,.4);

}

.flag{

font-size:95px;

margin-bottom:20px;

}

.code{

font-size:60px;

font-weight:900;

color:#00e6ff;

}

.country{

font-size:32px;

margin-top:10px;

}

.badge{

margin-top:20px;

display:inline-block;

padding:14px 36px;

border-radius:50px;

background:

linear-gradient(
90deg,
#ff00aa,
#4f46e5
);

font-weight:800;

}

<div class="challenge">

<h1>🔥 DAILY COUNTRY CHALLENGE</h1>

<p>
Complete quizzes and unlock more countries
</p>

<button>
START NOW
</button>

<style>

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:28px;

margin-top:60px;

}

.card{

background:
linear-gradient(
145deg,
#111827,
#0f172a
);

border:

1px solid
rgba(255,255,255,.08);

border-radius:28px;

padding:40px;

text-align:center;

transition:.35s;

box-shadow:

0 0 50px
rgba(0,255,255,.05);

}

.card:hover{

transform:
translateY(-10px);

box-shadow:

0 0 60px
rgba(0,255,255,.35);

}

.flag{

font-size:80px;

margin-bottom:20px;

}

.card h2{

font-size:34px;

color:#67e8f9;

}

.card p{

color:#b8c0d4;

margin:15px 0;

}

.card a{

display:inline-block;

padding:14px 32px;

border-radius:999px;

background:

linear-gradient(
90deg,
#00d4ff,
#7c3aed
);

color:white;

text-decoration:none;

font-weight:700;

}

.challenge{

margin-top:80px;

text-align:center;

padding:60px;

border-radius:35px;

background:

linear-gradient(
135deg,
#1e1b4b,
#111827
);

}

.challenge h1{

font-size:48px;

color:#00e5ff;

}

.challenge p{

margin:20px;

color:#d5d8e4;

}

.challenge button{

padding:18px 45px;

border:none;

border-radius:999px;

font-size:18px;

background:

linear-gradient(
90deg,
#00e5ff,
#9333ea
);

color:white;

}

</style>

<!-- FLOATING LIGHTS -->

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<footer>

🌍 QuizEmpire • Explore The World

</footer>

<style>

.orb{

position:fixed;

border-radius:50%;

filter:blur(120px);

z-index:-1;

animation:

float 12s infinite ease-in-out;

}

.orb1{

width:350px;

height:350px;

background:#ff00ff;

top:-100px;

left:-100px;

}

.orb2{

width:420px;

height:420px;

background:#00e5ff;

right:-120px;

top:300px;

animation-delay:2s;

}

.orb3{

width:300px;

height:300px;

background:#7c3aed;

left:40%;

bottom:-100px;

animation-delay:4s;

}

@keyframes float{

0%{

transform:

translateY(0px)

translateX(0px);

}

50%{

transform:

translateY(-80px)

translateX(40px);

}

100%{

transform:

translateY(0px)

translateX(0px);

}

}

footer{

margin-top:90px;

padding:40px;

text-align:center;

color:#b9c0da;

font-size:18px;

}

@media(max-width:700px){

.logo{

font-size:54px;

}

.challenge h1{

font-size:32px;

}

.card{

padding:28px;

}

.flag{

font-size:65px;

}

}

</style>

<script>

const search=

document.querySelector(

".search"

);

const cards=

document.querySelectorAll(

".card"

);

search.addEventListener(

"keyup",

()=>{

let value=

search.value

.toLowerCase();

cards.forEach(

card=>{

if(

card.innerText

.toLowerCase()

.includes(

value

)

){

card.style.display=

"block";

}

else{

card.style.display=

"none";

}

});

});

</script>
