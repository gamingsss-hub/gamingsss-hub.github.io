<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Format Converter | JPG PNG WEBP Converter | Toolora</title>

<meta name="description" content="Convert JPG, PNG and WEBP images online for free. Fast, secure and high quality image converter.">

<meta name="keywords" content="image converter,jpg to png,png to jpg,webp converter,image tools">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(135deg,#050816,#0f172a,#1e3a8a,#7c3aed);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

color:white;

}

.container{

width:100%;
max-width:900px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:30px;

padding:35px;

border:1px solid rgba(255,255,255,.12);

box-shadow:0 20px 60px rgba(0,0,0,.4);

}

h1{

font-size:38px;

text-align:center;

margin-bottom:10px;

}

.sub{

text-align:center;

color:#d1d5db;

margin-bottom:35px;

}

.upload{

border:3px dashed #60a5fa;

border-radius:25px;

padding:45px;

text-align:center;

cursor:pointer;

transition:.3s;

}

.upload:hover{

background:rgba(255,255,255,.05);

}

input[type=file]{

display:none;

}

.preview{

display:none;

margin-top:35px;

text-align:center;

}

.preview img{

width:100%;

max-height:350px;

object-fit:contain;

background:#111827;

border-radius:20px;

padding:15px;

}

select{

width:100%;

margin-top:25px;

padding:18px;

border:none;

outline:none;

border-radius:18px;

background:#111827;

color:white;

font-size:17px;

}

.buttons{

display:flex;

gap:15px;

margin-top:25px;

}

button{

flex:1;

padding:18px;

border:none;

border-radius:18px;

font-size:17px;

font-weight:700;

cursor:pointer;

}

.convertBtn{

background:linear-gradient(45deg,#2563eb,#7c3aed);

color:white;

}

.downloadBtn{

display:none;

background:#22c55e;

color:white;

}

</style>

</head>

<body>

<div class="container">

<h1>🖼 Image Format Converter</h1>

<p class="sub">

Convert JPG • PNG • WEBP Instantly

</p>

<label class="upload">

<input
type="file"
id="imageInput"
accept="image/*">

<div style="font-size:70px;">📤</div>

<h2>Choose Image</h2>

<p>Upload JPG, PNG or WEBP Image</p>

</label>

<div
class="preview"
id="preview">

<img id="previewImage">

</div>

<select id="format">

<option value="image/png">

PNG

</option>

<option value="image/jpeg">

JPG

</option>

<option value="image/webp">

WEBP

</option>

</select>

<div class="buttons">

<button
class="convertBtn"
id="convertBtn">

🔄 Convert Image

</button>

<button
class="downloadBtn"
id="downloadBtn">

⬇ Download

</button>

</div>

<script>

const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const previewImage=document.getElementById("previewImage");

const format=document.getElementById("format");

const convertBtn=document.getElementById("convertBtn");
const downloadBtn=document.getElementById("downloadBtn");

let convertedImage="";

// ===== Upload =====

imageInput.addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

preview.style.display="block";

previewImage.src=e.target.result;

}

reader.readAsDataURL(file);

});

// ===== Convert =====

convertBtn.addEventListener("click",()=>{

const file=imageInput.files[0];

if(!file){

alert("Please select an image.");

return;

}

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");

const ctx=canvas.getContext("2d");

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

convertedImage=canvas.toDataURL(format.value,1);

previewImage.src=convertedImage;

downloadBtn.style.display="block";

showToast("✅ Image Converted Successfully");

}

img.src=URL.createObjectURL(file);

});

// ===== Download =====

downloadBtn.addEventListener("click",()=>{

const link=document.createElement("a");

link.href=convertedImage;

if(format.value==="image/png"){

link.download="toolora-image.png";

}

else if(format.value==="image/jpeg"){

link.download="toolora-image.jpg";

}

else{

link.download="toolora-image.webp";

}

link.click();

});

// ===== Toast =====

function showToast(message){

const toast=document.createElement("div");

toast.innerHTML=message;

toast.style.position="fixed";
toast.style.bottom="20px";
toast.style.right="20px";
toast.style.background="#22c55e";
toast.style.color="#fff";
toast.style.padding="15px 22px";
toast.style.borderRadius="14px";
toast.style.fontWeight="700";
toast.style.boxShadow="0 10px 30px rgba(0,0,0,.35)";
toast.style.zIndex="9999";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2000);

}

</script>

</div>

</body>
</html>
