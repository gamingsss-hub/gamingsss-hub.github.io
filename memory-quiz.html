<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Memory Game – Train Your Brain Online

</title>

<meta
name="description"

content=

"Play Memory Game online and improve concentration by matching cards and beating your best score.">

<meta
name="keywords"

content=

"memory game, brain game, card match game, concentration game, online memory game">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

background:

linear-gradient(
135deg,
#050c18,
#0d1f45,
#07162f
);

color:white;

padding:20px;

text-align:center;

}

h1{

margin-bottom:15px;

}

.top{

display:flex;

justify-content:center;

gap:30px;

margin-bottom:20px;

}

.grid{

max-width:520px;

margin:auto;

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:12px;

}

.card{

height:95px;

background:

rgba(
255,
255,
255,
.08
);

backdrop-filter:

blur(15px);

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

font-size:40px;

cursor:pointer;

}

.open{

background:

#00c853;

}

.hide{

color:

transparent;

}

.win{

font-size:34px;

margin-top:40px;

}

</style>

</head>

<body>

<h1>

🧠 Memory Game

</h1>

<div class="top">

<div>

⏱
<span id="time">

0

</span>

s

</div>

<div>

🎯
<span id="moves">

0

</span>

</div>

</div>

<div

class="grid"

id="game">

</div>

<div

id="win">

</div>

<script>

const emojis=[

"🔥",
"🔥",

"⚡",
"⚡",

"🎮",
"🎮",

"🌍",
"🌍",

"🚀",
"🚀",

"🎡",
"🎡",

"🏆",
"🏆",

"🧠",
"🧠"

]

.sort(

()=>Math.random()

-.5

);

let first=null;

let second=null;

let lock=false;

let moves=0;

let matched=0;

let time=0;

setInterval(

()=>{

time++;

document

.getElementById(

"time"

)

.innerHTML=

time;

},

1000

);

const game=

document

.getElementById(

"game"

);

emojis

.forEach(

e=>{

let c=

document

.createElement(

"div"

);

c.className=

"card hide";

c.innerHTML=

e;

c.onclick=

()=>flip(c);

game

.appendChild(c);

}

);

function flip(c){

if(

lock||

!c

.classList

.contains(

"hide"

)

)

return;

c

.classList

.remove(

"hide"

);

if(

!first

){

first=c;

return;

}

second=c;

moves++;

document

.getElementById(

"moves"

)

.innerHTML=

moves;

if(

first

.innerHTML===

second

.innerHTML

){

matched++;

first

.classList

.add(

"open"

);

second

.classList

.add(

"open"

);

first=null;

second=null;

if(

matched===8

){

document

.getElementById(

"win"

)

.innerHTML=

`

<div class="win">

🏆 YOU WIN

<br>

${moves}

Moves

</div>

`;

}

}

else{

lock=true;

setTimeout(

()=>{

first

.classList

.add(

"hide"

);

second

.classList

.add(

"hide"

);

first=null;

second=null;

lock=false;

},

700

);

}

}

</script>

</body>

</html>
