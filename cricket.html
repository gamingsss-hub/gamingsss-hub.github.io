<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGNIVEERX REAL QUIZ PRO</title>

 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9899839569140080"
     crossorigin="anonymous"></script> 

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:95%;
max-width:750px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
position:relative;
}

.top{
display:flex;
justify-content:space-between;
color:#fbbf24;
margin-bottom:10px;
font-weight:bold;
}

.option{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{background:#00e6ff;color:black;}

.correct{background:#22c55e !important;}
.wrong{background:#ef4444 !important;}

button{
margin-top:10px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#00e6ff;
font-weight:bold;
cursor:pointer;
}

.previewBox{
position:absolute;
top:60px;
left:0;
right:0;
background:#0f172a;
max-height:300px;
overflow:auto;
display:none;
padding:10px;
border-radius:10px;
z-index:999;
}

.previewItem{
padding:6px;
margin:5px 0;
background:#111827;
cursor:pointer;
border-radius:6px;
font-size:12px;
}

.pop{
position:fixed;
top:20px;
right:20px;
padding:10px;
border-radius:8px;
animation:fade 1s;
}
@keyframes fade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>

<body>

<div class="box">

<div class="top">
<div id="sec">START</div>
<div>Score: <span id="score">0</span></div>
<div id="timer">⏳ 15</div>
</div>

<h2 id="q"></h2>
<div id="opt"></div>

<div id="ansBox" style="margin-top:10px;color:#22c55e;font-weight:bold;"></div>

<button onclick="togglePreview()">👁 Preview</button>
<div class="previewBox" id="preview"></div>

</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="no" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<script>

let quiz=[];

function add(sec,arr){
arr.forEach(q=>{
quiz.push({sec,q:q.q,o:q.o,c:q.c});
});
}


/* ================= CRICKET 25 REAL ================= */
add("CRICKET",[
{
q:"How many players in a cricket team?",
o:["10","11","12","9"],
c:1
},
{
q:"Length of cricket pitch?",
o:["20 yards","22 yards","24 yards","18 yards"],
c:1
},
{
q:"Who won ODI World Cup 2023?",
o:["India","Australia","England","New Zealand"],
c:1
},
{
q:"Maximum runs in one legal ball?",
o:["6","7","8","10"],
c:2
},
{
q:"Which country invented cricket?",
o:["India","England","Australia","South Africa"],
c:1
},
{
q:"How many balls in one over?",
o:["5","6","8","10"],
c:1
},
{
q:"Full form of ICC?",
o:["International Cricket Council","Indian Cricket Club","International Cup Council","None"],
c:0
},
{
q:"Which player is called Hitman?",
o:["Virat","Rohit Sharma","Dhoni","Gill"],
c:1
},
{
q:"Which format has 20 overs?",
o:["ODI","T20","Test","None"],
c:1
},
{
q:"First Cricket World Cup year?",
o:["1975","1983","1992","2003"],
c:0
},
{
q:"Runs for boundary?",
o:["2","3","4","5"],
c:2
},
{
q:"Runs for over boundary?",
o:["4","5","6","8"],
c:2
},
{
q:"Who is called Captain Cool?",
o:["Dhoni","Kohli","Rohit","Sachin"],
c:0
},
{
q:"Which country won 1983 World Cup?",
o:["Australia","India","England","Pakistan"],
c:1
},
{
q:"What does LBW mean?",
o:["Leg Before Wicket","Long Ball Win","Left Ball Wide","None"],
c:0
},
{
q:"Maximum overs in ODI?",
o:["20","50","90","100"],
c:1
},
{
q:"Which stadium hosted 2023 WC Final?",
o:["Wankhede","Ahmedabad","Eden Gardens","Delhi"],
c:1
},
{
q:"Which player has most ODI centuries?",
o:["Kohli","Sachin","Rohit","Ponting"],
c:0
},
{
q:"Duck means?",
o:["100 runs","0 runs","50 runs","10 runs"],
c:1
},
{
q:"How many umpires on field?",
o:["1","2","3","4"],
c:1
},
{
q:"Who is known as God of Cricket?",
o:["Kohli","Dhoni","Sachin","Rohit"],
c:2
},
{
q:"Test match maximum days?",
o:["3","4","5","6"],
c:2
},
{
q:"Which trophy India vs Australia Test series?",
o:["Border Gavaskar Trophy","Asia Cup","Champions Trophy","None"],
c:0
},
{
q:"What is strike rate?",
o:["Runs per 100 balls","Balls per run","Runs only","Overs"],
c:0
},
{
q:"Which country won T20 World Cup 2024?",
o:["India","Australia","England","Pakistan"],
c:0
}
]);


/* SHUFFLE */
quiz.forEach(q=>{
let correct=q.o[q.c];
for(let i=q.o.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[q.o[i],q.o[j]]=[q.o[j],q.o[i]];
}
q.c=q.o.indexOf(correct);
});

let i=0,score=0,timer,time=15;

function load(){
if(i>=quiz.length){
document.body.innerHTML=`<h1>Finished</h1><h2>Score: ${score}</h2>`;
return;
}

let q=quiz[i];
document.getElementById("sec").innerText=q.sec;
document.getElementById("q").innerText=q.q;
document.getElementById("score").innerText=score;

let box=document.getElementById("opt");
box.innerHTML="";

q.o.forEach((op,idx)=>{
let d=document.createElement("div");
d.className="option";
d.innerText=op;
d.onclick=()=>check(idx);
box.appendChild(d);
});

startTimer();
}

function startTimer(){
clearInterval(timer);
time=15;
timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏳ "+time;
if(time<=0) next();
},1000);
}

function pop(msg,color){
let d=document.createElement("div");
d.className="pop";
d.style.background=color;
d.innerText=msg;
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

function check(ans){

clearInterval(timer);

let q=quiz[i];
let correctText=q.o[q.c];

let opt=document.querySelectorAll(".option");

opt.forEach(o=>o.style.pointerEvents="none");

if(ans===q.c){

score++;

document.getElementById("ok").play();

pop("+1 Correct ✔","green");

opt[ans].classList.add("correct");

}else{

score--;

document.getElementById("no").play();

pop("-1 Wrong ❌","red");

opt[ans].classList.add("wrong");

opt[q.c].classList.add("correct");

}

document.getElementById("score").innerText=score;

/* show answer */

document.getElementById("ansBox").innerHTML=
"✅ Correct Answer: "+correctText;

setTimeout(()=>{

document.getElementById("ansBox").innerHTML="";

i++;

load();

},1500);

}

function togglePreview(){

let p=document.getElementById("preview");

if(p.style.display==="block"){
p.style.display="none";
return;
}

p.style.display="block";
p.innerHTML="";

quiz.forEach((q,idx)=>{

let d=document.createElement("div");

d.className="previewItem";

d.innerText=(idx+1)+". "+q.q;

d.onclick=()=>{
i=idx;
load();
p.style.display="none";
};

p.appendChild(d);

});

}
  
load();

</script>

</body>
</html>
