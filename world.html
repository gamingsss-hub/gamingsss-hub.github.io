<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Fun Zone</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#07111f,
#111827
);

color:white;

padding:30px;

text-align:center;

}

.title{

font-size:50px;

color:#00e6ff;

font-weight:900;

margin-top:20px;

}

.cards{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(280px,1fr)
);

gap:25px;

margin-top:50px;

}

.card{

background:#182338;

padding:35px;

border-radius:22px;

text-decoration:none;

color:white;

transition:.3s;

}

.card:hover{

transform:
translateY(-8px);

box-shadow:
0 0 25px #00e6ff;

}

.icon{

font-size:70px;

}

.name{

font-size:30px;

margin-top:15px;

}

.back{

display:inline-block;

margin-top:40px;

padding:14px 30px;

background:#00e6ff;

color:black;

text-decoration:none;

border-radius:12px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="title">

🎮 FUN ZONE

</div>

<div class="cards">

<a
href="funquiz.html"
class="card">

<div class="icon">

😂

</div>

<div class="name">

Fun Quiz

</div>

</a>

<a
href="brainquiz.html"
class="card">

<div class="icon">

🧠

</div>

<div class="name">

Brain Quiz

</div>

</a>

</div>

<a
href="index.html"
class="back">

⬅ Back Home

</a>

</body>

</html>
