<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Currency Converter – Toolora | Live Converter

</title>

<meta
name="description"
content="Convert currencies instantly with Toolora Currency Converter. Fast and simple exchange calculator.">

<meta
name="keywords"
content="currency converter, exchange rate, money converter, usd inr, toolora">

<link
rel="icon"
href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#050b18;

color:white;

padding:24px;

}

.box{

max-width:620px;

margin:auto;

background:#091428;

padding:30px;

border-radius:30px;

}

h1{

font-size:36px;

margin-bottom:24px;

}

select,
input{

width:100%;

padding:18px;

margin-top:14px;

border:none;

border-radius:18px;

background:#13213f;

color:white;

}

button{

width:100%;

padding:18px;

margin-top:18px;

border:none;

border-radius:20px;

background:

linear-gradient(
45deg,
#6d42ff,
#009dff
);

color:white;

font-size:18px;

}

.result{

margin-top:28px;

font-size:32px;

font-weight:900;

}

.back{

display:inline-block;

margin-bottom:20px;

color:white;

text-decoration:none;

}

</style>

</head>

<body>

<div class="box">

<a
href="utility.html"
class="back">

← Utility

</a>

<h1>

💸 Currency Converter

</h1>

<input
type="number"
id="amount"
placeholder="Enter Amount">

<select id="from">

<option>USD</option>

<option>INR</option>

<option>EUR</option>

<option>GBP</option>

<option>AED</option>

</select>

<select id="to">

<option>INR</option>

<option>USD</option>

<option>EUR</option>

<option>GBP</option>

<option>AED</option>

</select>

<button onclick="convert()">

Convert

</button>

<div
class="result"
id="result">

0

</div>

</div>

<script>

const rates={

USD:1,

INR:87,

EUR:0.85,

GBP:0.73,

AED:3.67

};

function convert(){

let amount=

Number(

document.getElementById(

"amount"

).value

);

let from=

document.getElementById(

"from"

).value;

let to=

document.getElementById(

"to"

).value;

let usd=

amount/

rates[from];

let final=

usd*

rates[to];

document.getElementById(

"result"

).innerHTML=

final.toFixed(2)

+" "+to;

}

</script>

</body>

</html>
