<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>

Calculator – Toolora | Free Online Calculator

</title>

<meta
name="description"
content="Free Toolora calculator. Fast online calculator for addition subtraction multiplication division.">

<meta
name="keywords"
content="calculator, toolora calculator, online calculator, utility tools, math calculator">

<meta
name="author"
content="Toolora">

<meta
name="theme-color"
content="#050b18">

<link
rel="icon"
href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#050b18;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

color:white;

}

.box{

width:360px;

background:#0d1730;

padding:26px;

border-radius:34px;

}

.back{

color:white;

text-decoration:none;

}

.title{

font-size:34px;

font-weight:900;

margin:20px 0;

}

#display{

width:100%;

height:90px;

border:none;

outline:none;

padding:20px;

font-size:34px;

text-align:right;

background:#081122;

color:white;

border-radius:22px;

margin-bottom:18px;

}

.grid{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:10px;

}

button{

height:70px;

border:none;

border-radius:20px;

font-size:24px;

background:#14254a;

color:white;

}

.op{

background:#5f48ff;

}

.equal{

background:#ff6b00;

}

.zero{

grid-column:span 2;

}

</style>

</head>

<body>

<div class="box">

<a href="utility.html"
class="back">

← Utility

</a>

<div class="title">

🧮 Calculator

</div>

<input
id="display"
readonly>

<div class="grid">

<button onclick="clr()">C</button>

<button onclick="del()">⌫</button>

<button class="op" onclick="add('/')">÷</button>

<button class="op" onclick="add('*')">×</button>

<button onclick="add('7')">7</button>

<button onclick="add('8')">8</button>

<button onclick="add('9')">9</button>

<button class="op" onclick="add('-')">−</button>

<button onclick="add('4')">4</button>

<button onclick="add('5')">5</button>

<button onclick="add('6')">6</button>

<button class="op" onclick="add('+')">+</button>

<button onclick="add('1')">1</button>

<button onclick="add('2')">2</button>

<button onclick="add('3')">3</button>

<button class="equal" onclick="solve()">=</button>

<button class="zero" onclick="add('0')">0</button>

<button onclick="add('.')">.</button>

</div>

</div>

<script>

let d=document.getElementById("display");

function add(v){

d.value+=v

}

function clr(){

d.value=""

}

function del(){

d.value=d.value.slice(0,-1)

}

function solve(){

try{

d.value=eval(d.value)

}

catch{

d.value="Error"

}

}

</script>

</body>

</html>
